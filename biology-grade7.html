        answer: 2,

      { source:'改编自深圳模拟题',
        q:'用糖拌番茄时，番茄会流出大量汁水。这是因为：',
        options: ['番茄细胞进行呼吸作用产生了水', '番茄细胞吸水膨胀破裂了', '糖使外界溶液浓度大于细胞液浓度，细胞失水', '糖进入细胞内，水被挤出来了'],

      { source:'改编自2022深圳中考真题',
        q:'在我国北方，大多数树木在冬天会落叶。树木落叶的主要意义是：',

        answer: 1,
        explain: '冬季寒冷干旱，根系吸水能力大大降低。树木通过落叶可以大大减少蒸腾作用，减少水分的散失，是植物适应冬季寒冷干旱环境的一种方式。这是生物对环境的适应。' },
      { source:'改编自广东中考真题',
        q:'在生态系统中，营养级越高的生物，数量越少。这是因为：',

      { source:'改编自深圳一模真题',
        q:'果农在果园里放养蜜蜂可以提高果树的产量。这是因为蜜蜂能：',
        options: ['帮助果树传粉', '帮助果树传播种子', '消灭果树的害虫', '给果树提供肥料'],

        explain: '果树是虫媒花，需要昆虫帮助传粉才能结果。蜜蜂在采集花蜜的过程中，身上会沾上花粉，当它飞到另一朵花上时，就帮助完成了传粉过程。传粉不足会导致果树减产，放养蜜蜂可以提高传粉效率，从而提高产量。' },
      { source:'改编自教材材料分析',
        q:'「大树底下好乘凉」。从生物学角度分析，主要原因是：',

      { source:'改编自深圳期末统考',
        q:'有些植物的种子成熟后，即使条件适宜也不立即萌发，需要经过一段时间才能萌发。这种现象叫休眠。种子休眠的意义是：',

      { source:'改编自广东中考模拟',
        q:'如果在绿色植物的叶片上涂上一层凡士林（不透水不透气），一段时间后植物会萎蔫。这主要是因为：',

    round3: [
      { source:'改编自2023深圳中考真题（综合推理型）',
        q:'某草原生态系统中存在食物链：草→鼠→蛇→鹰。下列关于该生态系统的推理，正确的是：\n①如果鹰的数量减少，蛇的数量会先增加后减少\n②有毒物质在草体内积累最多\n③能量流动方向是草→鼠→蛇→鹰\n④生态系统中数量最多的是草',
        options: ['①②③', '①②④', '①③④', '②③④'],
        answer: 2,
        explain: '①③④正确。①鹰减少，蛇因天敌减少先增加，但蛇太多导致鼠减少，蛇又因食物减少而减少，最后趋于稳定；③能量沿食物链流动，方向是从生产者到消费者；④生产者（草）数量最多，能量沿食物链递减，生物数量也递减。②错误，有毒物质沿食物链富集，营养级越高积累越多，鹰体内积累最多。' },
      { source:'改编自广东中考真题（现象解释型）',
        q:'下列生物现象与原因的对应关系，错误的是：',
        options: ['仙人掌的叶变成刺——减少水分散失，适应干旱环境', '骆驼刺根系发达——吸收深层地下水，适应干旱', '企鹅皮下脂肪很厚——保温，适应寒冷环境', '蚯蚓在土壤中生活——只适应环境，不影响环境'],
        answer: 3,

      { source:'改编自深圳期末真题（综合分析型）',
        q:'在一个封闭的生态瓶中（有水草、小鱼、水、河泥等），小鱼和水草都能存活较长时间。下列分析错误的是：',
        options: ['水草光合作用产生氧气，供小鱼呼吸', '小鱼呼吸作用产生二氧化碳，供水草光合作用', '河泥中的分解者能分解有机物，参与物质循环', '该生态瓶不需要阳光也能长期维持'],
        answer: 3,
        explain: '该生态系统的能量最终来源于阳光，水草的光合作用需要光。如果没有阳光，水草不能进行光合作用制造有机物和氧气，小鱼很快会因缺氧和缺少食物而死亡。所以该生态瓶需要阳光才能长期维持。' },
      { source:'改编自深圳二模真题（因果推理型）',
        q:'下列哪项不是光合作用在农业生产上的应用？',
        options: ['合理密植，充分利用光照', '温室大棚中适当增加二氧化碳浓度', '阴天给大棚植物适当补充光照', '给农田松土，促进根的呼吸作用'],
        answer: 3,
        explain: 'A、B、C都是通过促进光合作用来提高产量的措施：合理密植充分利用光照、增加二氧化碳浓度（气肥）增加原料、补充光照延长光合作用时间。D给农田松土是促进根的呼吸作用，促进根的生长和无机盐吸收，与光合作用没有直接关系。' },
      { source:'改编自教材综合题（现象推理型）',
        q:'「人间四月芳菲尽，山寺桃花始盛开」。造成这一差异的主要原因是：',
        options: ['山上的阳光比山下少', '山上的温度比山下低', '山上的水分比山下少', '山上的空气比山下稀薄'],
        answer: 1,
        explain: '影响桃花开花时间的主要因素是温度。海拔每升高100米，气温约下降0.6°C。山上的温度比山下低，所以桃花开花时间比山下晚。这体现了温度对生物（植物开花）的影响，也说明环境影响生物。' },
      { source:'改编自深圳一模真题（推理解释型）',
        q:'将萌发的种子装入密闭的保温瓶中，几小时后瓶内温度升高，同时将瓶内气体通入澄清石灰水，石灰水变浑浊。这些现象说明：\n①呼吸作用产生热量\n②呼吸作用产生二氧化碳\n③呼吸作用消耗氧气\n④呼吸作用产生水',
        options: ['①②', '①③', '②③', '②④'],
        answer: 0,

      { source:'改编自广东中考模拟（现象对比型）',
        q:'比较植物三大生理作用的意义，下列说法正确的是：\n①光合作用制造有机物，是物质和能量的来源\n②呼吸作用释放能量，为生命活动提供动力\n③蒸腾作用只有坏处，浪费水分\n④三大作用都是植物生存所必需的',
        options: ['①②③', '①②④', '①③④', '②③④'],
        answer: 1,
        explain: '①②④正确。光合作用制造有机物储存能量，是几乎所有生物物质和能量的来源；呼吸作用分解有机物释放能量，为生命活动提供动力；蒸腾作用不是浪费水分，而是对植物有重要意义（吸水动力、降温等）。三大作用都是植物生存所必需的。' },
      { source:'改编自深圳期末真题（综合推理型）',
        q:'某同学将同一株植物的两个叶片分别放入甲乙两个密闭瓶中，甲瓶遮光，乙瓶透光。几小时后，将燃烧的蜡烛分别放入两瓶中，甲瓶中蜡烛立即熄灭，乙瓶中蜡烛继续燃烧。下列推理错误的是：',
        options: ['甲瓶中氧气被呼吸作用消耗了', '乙瓶中光合作用产生了氧气', '该实验说明光合作用产生氧气，呼吸作用消耗氧气', '该实验证明光合作用需要二氧化碳'],
        answer: 3,
        explain: '甲瓶遮光，植物只进行呼吸作用，消耗了氧气，所以蜡烛熄灭；乙瓶透光，植物既进行呼吸作用也进行光合作用，且光合作用强度大于呼吸作用，释放了氧气，所以蜡烛继续燃烧。实验说明光合作用产生氧气、呼吸作用消耗氧气。但该实验不能证明光合作用需要二氧化碳（没有以二氧化碳为变量）。' },
      { source:'改编自教材拓展题（现象分析型）',
        q:'有些植物（如向日葵）的花盘会随着太阳转动，含羞草受到触碰叶片会合拢。这些现象说明：',
        options: ['植物能进行光合作用', '植物能进行呼吸作用', '植物能对外界刺激作出反应', '植物能生长和繁殖'],
        answer: 2,
        explain: '向日葵花盘随太阳转动、含羞草受触碰叶片合拢，这些都是生物对外界刺激作出反应的特征（应激性）。植物虽然不能像动物一样自由运动，但也具有应激性，能对外界刺激（如光、触碰等）作出反应。' },
      { source:'改编自深圳中考模拟（综合应用推理型）',
        q:'为了提高温室大棚蔬菜的产量，下列措施中不合理的是：',
        options: ['适当增加光照时间，促进光合作用', '适当增加二氧化碳浓度，增加光合作用原料', '昼夜都提高温度，促进光合作用和呼吸作用', '夜间适当降低温度，减少呼吸作用消耗'],
        answer: 2,
        explain: '提高产量需要增加有机物的积累，即促进光合作用、抑制呼吸作用。A、B都能促进光合作用，增加有机物制造；D夜间降低温度能抑制呼吸作用，减少有机物消耗。C错，白天适当升温可促进光合作用，但夜间升温会增强呼吸作用，消耗更多有机物，反而降低产量。合理的做法是昼夜温差大（白天高温、夜间低温）。' }

      { source:'改编自2022广东中考真题',

        answer: 1,

function loadWrongBook() {
  try {
    var s = localStorage.getItem(WRONGBOOK_KEY);
    if (s) return JSON.parse(s);
  } catch(e) {}
  return { history: [], morality: [], biology: [], geography: [] };
}

function saveWrongBook(wb) {
  try { localStorage.setItem(WRONGBOOK_KEY, JSON.stringify(wb)); } catch(e) {}
}

function addWrongQuestion(qInfo) {
  var wb = loadWrongBook();
  var list = wb[SUBJECT_ID] || [];
  // 检查是否已存在（用 q 内容去重）
  for (var i = 0; i < list.length; i++) {
    if (list[i].q === qInfo.q) {
      list[i].wrongCount++;
      list[i].lastWrongAt = Date.now();
      list[i].userAnswer = qInfo.userAnswer;
      wb[SUBJECT_ID] = list;
      saveWrongBook(wb);
      return;
    }
  }
  // 新增
  list.unshift({
    id: SUBJECT_ID + '_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
    subject: SUBJECT_NAME,
    subjectId: SUBJECT_ID,
    source: qInfo.source || '练习',
    q: qInfo.q,
    options: qInfo.options || null,
    answer: qInfo.answer,
    userAnswer: qInfo.userAnswer,
    explain: qInfo.explain || '',
    qType: qInfo.qType || 'choice',
    wrongCount: 1,
    addedAt: Date.now(),
    lastWrongAt: Date.now(),
    correctCount: 0
  });
  wb[SUBJECT_ID] = list;
  saveWrongBook(wb);
}

function markWrongCorrect(qid) {
  var wb = loadWrongBook();
  var list = wb[SUBJECT_ID] || [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === qid) {
      list[i].correctCount = (list[i].correctCount || 0) + 1;
      wb[SUBJECT_ID] = list;
      saveWrongBook(wb);
      return;
    }
  }
}

function getWrongCount(subjectId) {
  var wb = loadWrongBook();
  return (wb[subjectId] || []).length;
}

function startWrongBookPractice() {
  var wb = loadWrongBook();
  var list = wb[SUBJECT_ID] || [];
  if (list.length === 0) return;
  
  // 转换为选择题形式用于练习
  var questions = [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].options) {
      questions.push({
        id: list[i].id,
        q: list[i].q,
        options: list[i].options,
        answer: list[i].answer,
        explain: list[i].explain,
        source: list[i].source,
        _isWrong: true
      });
    }
  }
  
  if (questions.length === 0) {
    alert('当前没有可练习的选择题型错题');
    return;
  }
  
  wrongBookState = {
    current: 0,
    questions: questions,
    selectedAnswer: null,
    answered: false,
    mode: 'practice',
    score: 0
  };
  
  renderWrongBookQuestion();
}

function renderWrongBookQuestion() {
  var q = wrongBookState.questions[wrongBookState.current];
  var total = wrongBookState.questions.length;
  var html = '';
  html += '<div class="wb-practice-header">';
  html += '<button class="nav-btn" onclick="renderWrongBookList()">← 返回错题本</button>';
  html += '<div class="wb-progress">第 ' + (wrongBookState.current+1) + ' / ' + total + ' 题</div>';
  html += '</div>';
  
  html += '<div class="q-card">';
  html += '<div class="q-source">' + (q.source || '错题练习') + '</div>';
  html += '<div class="q-text">' + (wrongBookState.current+1) + '. ' + q.q + '</div>';
  html += '<div class="q-options">';
  for (var i = 0; i < q.options.length; i++) {
    html += '<div class="q-option" onclick="wbSelectOption(' + i + ', this)" data-idx="' + i + '">';
    html += '<span class="q-opt-label">' + String.fromCharCode(65+i) + '</span>' + q.options[i] + '</div>';
  }
  html += '</div>';
  html += '<div id="wbFeedback" class="feedback"></div>';
  html += '<div class="q-actions">';
  html += '<button id="wbSubmitBtn" class="btn-primary" onclick="wbSubmitAnswer()">提交答案</button>';
  html += '<button id="wbNextBtn" class="btn-primary" onclick="wbNextQuestion()" style="display:none;">下一题 →</button>';
  html += '</div>';
  html += '</div>';
  
  document.getElementById('wrongBookContent').innerHTML = html;
}

function wbSelectOption(idx, el) {
  if (wrongBookState.answered) return;
  wrongBookState.selectedAnswer = idx;
  var opts = document.querySelectorAll('#wrongBookContent .q-option');
  for (var i = 0; i < opts.length; i++) {
    opts[i].classList.remove('selected');
  }
  el.classList.add('selected');
}

function wbSubmitAnswer() {
  var q = wrongBookState.questions[wrongBookState.current];
  if (wrongBookState.selectedAnswer === null) return;
  var isCorrect = wrongBookState.selectedAnswer === q.answer;
  
  var opts = document.querySelectorAll('#wrongBookContent .q-option');
  for (var i = 0; i < opts.length; i++) {
    opts[i].classList.add('disabled');
    if (i === q.answer) opts[i].classList.add('correct');
    else if (i === wrongBookState.selectedAnswer) opts[i].classList.add('wrong');
  }
  
  wrongBookState.answered = true;
  if (isCorrect) {
    wrongBookState.score += 10;
    markWrongCorrect(q.id);
  } else {
    // 答错了再记一次
    addWrongQuestion({
      q: q.q, options: q.options, answer: q.answer,
      userAnswer: wrongBookState.selectedAnswer, explain: q.explain,
      source: q.source, qType: 'choice'
    });
  }
  
  var fb = document.getElementById('wbFeedback');
  fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
  fb.innerHTML = '<div class="fb-title">' + (isCorrect ? '✅ 回答正确！+10分' : '❌ 答案有误') + '</div>';
  if (q.explain) fb.innerHTML += '<div class="fb-explain">' + q.explain + '</div>';
  
  document.getElementById('wbSubmitBtn').style.display = 'none';
  document.getElementById('wbNextBtn').style.display = 'inline-block';
}

function wbNextQuestion() {
  if (!wrongBookState.answered) return;
  wrongBookState.current++;
  if (wrongBookState.current >= wrongBookState.questions.length) {
    wbShowResult();
  } else {
    wrongBookState.answered = false;
    wrongBookState.selectedAnswer = null;
    renderWrongBookQuestion();
  }
}

function wbShowResult() {
  var total = wrongBookState.questions.length;
  var score = wrongBookState.score;
  var correct = Math.round(score / 10);
  var html = '';
  html += '<div class="wb-practice-header">';

  document.getElementById('wrongBookContent').innerHTML = html;

function loadAllData() {
  try {
    var s = localStorage.getItem(STORAGE_KEY);
    if (s) return JSON.parse(s);
  } catch(e) {}
  return {
    rounds: { experiment: 1, structure: 1, concept: 1, phenomenon: 1, chart: 1, comprehensive: 1 },
    stats: [],
    sessions: {}
  };
}

function saveAllData(d) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch(e) {}
}

function getRound(mode) {
  var d = loadAllData();
  return d.rounds[mode] || 1;
}

function advanceRound(mode) {
  var d = loadAllData();
  if (d.rounds[mode] < TOTAL_ROUNDS) {
    d.rounds[mode]++;
    saveAllData(d);
    return true;
  }
  return false;
}

function saveSession() {
  var d = loadAllData();
  d.sessions[quizState.mode] = {
    round: quizState.round,
    current: quizState.current,
    score: quizState.score,
    questions: quizState.questions,
    results: quizState.results,
    answered: quizState.answered,
    selectedAnswer: quizState.selectedAnswer
  };
  saveAllData(d);
}

function loadSession(mode) {
  var d = loadAllData();
  return d.sessions[mode] || null;
}

function clearSession(mode) {
  var d = loadAllData();
  delete d.sessions[mode];
  saveAllData(d);
}

function hasUnfinishedSession(mode) {
  var s = loadSession(mode);
  if (!s) return false;
  return s.current < s.questions.length;
}

function renderModes() {
  var modes = ['experiment', 'structure', 'concept', 'phenomenon', 'chart', 'comprehensive'];

  for (var i = 0; i < modes.length; i++) {
    var mode = modes[i];
    var round = getRound(mode);
    var count = mode === 'comprehensive' ? 25 : 10;
    var roundLabel = round <= TOTAL_ROUNDS ? '第' + round + '轮' : '已通关';

    html += '<div class="mode-icon">' + MODE_ICONS[mode] + '</div>';
    html += '<div class="mode-name">' + MODE_NAMES[mode] + '</div>';
    html += '<div class="mode-desc">' + MODE_DESCS[mode] + '</div>';
    html += '<div class="mode-count">' + count + '题</div>';
    html += '<div class="mode-round">' + roundLabel + '</div>';
    html += '</div>';
  }
  document.getElementById('quizModes').innerHTML = html;
}

function toggleUnitQuiz(ui) {

}

function initUnitQuizState(ui) {
  if (!unitQuizState[ui]) {
    var quiz = UNIT_QUIZ[ui];
    var answers = [];
    var submitted = [];
    for (var i = 0; i < quiz.questions.length; i++) {
      answers.push(null);
      submitted.push(false);
    }
    unitQuizState[ui] = { answers: answers, submitted: submitted, score: 0 };
  }
}

function renderUnitQuiz(ui) {
  initUnitQuizState(ui);
  var quiz = UNIT_QUIZ[ui];
  var state = unitQuizState[ui];
  var html = '';
  
  for (var qi = 0; qi < quiz.questions.length; qi++) {
    var q = quiz.questions[qi];
    html += '<div class="uq-card" id="uq-card-' + ui + '-' + qi + '">';
    html += '<span class="uq-type-badge uq-' + q.type + '">' + q.typeLabel + '</span>';
    html += '<div class="uq-source">' + q.source + '</div>';
    
    if (q.type === 'material' && q.material) {
      html += '<div class="uq-material-text">' + q.material + '</div>';
    }
    
    html += '<div class="uq-question">' + (qi + 1) + '. ' + q.q + '</div>';
    
    if (q.type === 'judge') {
      html += '<div class="uq-judge-options" id="uq-judge-' + ui + '-' + qi + '">';
      var trueClass = 'uq-judge-btn';
      var falseClass = 'uq-judge-btn';
      if (state.submitted[qi]) {
        trueClass += ' disabled';
        falseClass += ' disabled';
        if (q.answer === true) trueClass += ' correct';
        else falseClass += ' correct';
        if (state.answers[qi] === true && q.answer !== true) trueClass += ' wrong';
        if (state.answers[qi] === false && q.answer !== false) falseClass += ' wrong';
      } else if (state.answers[qi] !== null) {
        if (state.answers[qi] === true) trueClass += ' selected';
        else falseClass += ' selected';
      }
      html += '<div class="' + trueClass + '" onclick="selectUnitJudge(' + ui + ',' + qi + ',true)">正确</div>';
      html += '<div class="' + falseClass + '" onclick="selectUnitJudge(' + ui + ',' + qi + ',false)">错误</div>';
      html += '</div>';
    } else {
      html += '<div class="uq-options" id="uq-options-' + ui + '-' + qi + '">';
      var labels = ['A','B','C','D'];
      for (var oi = 0; oi < q.options.length; oi++) {
        var optClass = 'uq-option';
        if (state.submitted[qi]) {
          optClass += ' disabled';
          if (oi === q.answer) optClass += ' correct';
          else if (oi === state.answers[qi] && oi !== q.answer) optClass += ' wrong';
        } else if (state.answers[qi] === oi) {
          optClass += ' selected';
        }
        html += '<div class="' + optClass + '" onclick="selectUnitOption(' + ui + ',' + qi + ',' + oi + ')">';
        html += '<span class="opt-label">' + labels[oi] + '</span>';
        html += '<span>' + q.options[oi] + '</span>';
        html += '</div>';
      }
      html += '</div>';
    }
    
    if (!state.submitted[qi]) {
      var disabled = state.answers[qi] === null ? 'disabled' : '';
      var btnStyle = state.answers[qi] === null ? 'opacity:0.5;cursor:default;' : '';
      html += '<div style="margin-top:12px;text-align:right;">';
      html += '<button class="uq-reset-btn" style="' + btnStyle + '" ' + disabled + ' onclick="submitUnitAnswer(' + ui + ',' + qi + ')">提交答案</button>';
      html += '</div>';
    }
    
    var explainClass = 'uq-explain' + (state.submitted[qi] ? ' show' : '');
    var isCorrect = state.submitted[qi] && state.answers[qi] === q.answer;
    var resultText = isCorrect ? '<strong style="color:var(--leaf);">&#10003; 回答正确</strong>' : (state.submitted[qi] ? '<strong style="color:var(--crimson);">&#10007; 回答错误</strong>' : '');
    html += '<div class="' + explainClass + '" id="uq-explain-' + ui + '-' + qi + '">' + resultText + '<br>' + q.explain + '</div>';
    
    html += '</div>';
  }
  
  // 得分统计栏
  var correctCount = 0;
  var answeredCount = 0;
  for (var si = 0; si < state.submitted.length; si++) {
    if (state.submitted[si]) {
      answeredCount++;
      if (state.answers[si] === quiz.questions[si].answer) correctCount++;
    }
  }
  var score = Math.round((correctCount / quiz.questions.length) * 100);
  state.score = answeredCount === quiz.questions.length ? score : 0;
  
  html += '<div class="uq-score-bar">';
  html += '<div class="uq-score-info">已完成 <strong>' + answeredCount + '</strong>/' + quiz.questions.length + ' 题 · 答对 <strong style="color:var(--leaf);">' + correctCount + '</strong> 题 · 得分 <strong>' + (answeredCount === quiz.questions.length ? score : '--') + '</strong> 分</div>';
  html += '<button class="uq-reset-btn" onclick="resetUnitQuiz(' + ui + ')">重新测试</button>';
  html += '</div>';
  
  return html;
}

function selectUnitOption(ui, qi, oi) {
  initUnitQuizState(ui);
  var state = unitQuizState[ui];
  if (state.submitted[qi]) return;
  state.answers[qi] = oi;
  updateUnitQuestion(ui, qi);
}

function selectUnitJudge(ui, qi, val) {
  initUnitQuizState(ui);
  var state = unitQuizState[ui];
  if (state.submitted[qi]) return;
  state.answers[qi] = val;
  updateUnitQuestion(ui, qi);
}

function submitUnitAnswer(ui, qi) {
  initUnitQuizState(ui);
  var state = unitQuizState[ui];
  if (state.submitted[qi] || state.answers[qi] === null) return;
  state.submitted[qi] = true;
  
  // 错题收录（单元小结测试）
  var quiz = UNIT_QUIZ[ui];
  var q = quiz.questions[qi];
  var isCorrect = state.answers[qi] === q.answer;
  if (!isCorrect) {
    var unitName = REVIEW_DATA[ui].name;
    if (q.type === 'choice' && q.options) {
      addWrongQuestion({
        q: q.q, options: q.options, answer: q.answer,
        userAnswer: state.answers[qi], explain: q.explain || '',
        source: '单元小结-' + unitName, qType: 'choice'
      });
    } else if (q.type === 'judge') {
      addWrongQuestion({
        q: q.q, options: ['正确', '错误'], answer: q.answer ? 0 : 1,
        userAnswer: state.answers[qi] ? 0 : 1, explain: q.explain || '',
        source: '单元小结-' + unitName, qType: 'judge'
      });
    }
  }
  
  updateUnitQuestion(ui, qi);
  updateUnitScoreBar(ui);
}

function updateUnitQuestion(ui, qi) {
  var quiz = UNIT_QUIZ[ui];
  var state = unitQuizState[ui];
  var q = quiz.questions[qi];
  var card = document.getElementById('uq-card-' + ui + '-' + qi);
  if (!card) return;
  
  if (q.type === 'judge') {
    var container = document.getElementById('uq-judge-' + ui + '-' + qi);
    if (container) {
      var btns = container.querySelectorAll('.uq-judge-btn');
      var trueBtn = btns[0];
      var falseBtn = btns[1];
      trueBtn.className = 'uq-judge-btn';
      falseBtn.className = 'uq-judge-btn';
      if (state.submitted[qi]) {
        trueBtn.classList.add('disabled');
        falseBtn.classList.add('disabled');
        if (q.answer === true) trueBtn.classList.add('correct');
        else falseBtn.classList.add('correct');
        if (state.answers[qi] === true && q.answer !== true) trueBtn.classList.add('wrong');
        if (state.answers[qi] === false && q.answer !== false) falseBtn.classList.add('wrong');
      } else if (state.answers[qi] !== null) {
        if (state.answers[qi] === true) trueBtn.classList.add('selected');
        else falseBtn.classList.add('selected');
      }
    }
  } else {
    var optsContainer = document.getElementById('uq-options-' + ui + '-' + qi);
    if (optsContainer) {
      var opts = optsContainer.querySelectorAll('.uq-option');
      for (var oi = 0; oi < opts.length; oi++) {
        opts[oi].className = 'uq-option';
        if (state.submitted[qi]) {
          opts[oi].classList.add('disabled');
          if (oi === q.answer) opts[oi].classList.add('correct');
          else if (oi === state.answers[qi] && oi !== q.answer) opts[oi].classList.add('wrong');
        } else if (state.answers[qi] === oi) {
          opts[oi].classList.add('selected');
        }
      }
    }
  }
  
  if (!state.submitted[qi]) {
    var btn = card.querySelector('.uq-reset-btn');
    if (btn && btn.textContent === '提交答案') {
      if (state.answers[qi] !== null) {
        btn.style.opacity = '1';
        btn.style.cursor = 'pointer';
        btn.disabled = false;
      } else {
        btn.style.opacity = '0.5';
        btn.style.cursor = 'default';
        btn.disabled = true;
      }
    }
  } else {
    var submitBtn = card.querySelector('.uq-reset-btn');
    if (submitBtn && submitBtn.textContent === '提交答案') {
      submitBtn.parentElement.style.display = 'none';
    }
    var explainEl = document.getElementById('uq-explain-' + ui + '-' + qi);
    if (explainEl) {
      explainEl.classList.add('show');
      var isCorrect2 = state.answers[qi] === q.answer;
      var resultText = isCorrect2 ? '<strong style="color:var(--leaf);">&#10003; 回答正确</strong>' : '<strong style="color:var(--crimson);">&#10007; 回答错误</strong>';
      explainEl.innerHTML = resultText + '<br>' + q.explain;
    }
  }
}

function updateUnitScoreBar(ui) {
  var quiz = UNIT_QUIZ[ui];
  var state = unitQuizState[ui];
  var correctCount = 0;
  var answeredCount = 0;
  for (var si = 0; si < state.submitted.length; si++) {
    if (state.submitted[si]) {
      answeredCount++;
      if (state.answers[si] === quiz.questions[si].answer) correctCount++;
    }
  }
  var score = Math.round((correctCount / quiz.questions.length) * 100);
  
  var section = document.getElementById('unit-quiz-' + ui);
  if (!section) return;
  var scoreBar = section.querySelector('.uq-score-bar');
  if (scoreBar) {
    scoreBar.querySelector('.uq-score-info').innerHTML = 
      '已完成 <strong>' + answeredCount + '</strong>/' + quiz.questions.length + ' 题 · 答对 <strong style="color:var(--leaf);">' + correctCount + '</strong> 题 · 得分 <strong>' + (answeredCount === quiz.questions.length ? score : '--') + '</strong> 分';
  }
}

function resetUnitQuiz(ui) {
  if (!confirm('确定要重新测试吗？当前答题进度将被清除。')) return;
  unitQuizState[ui] = null;
  var contentEl = document.querySelector('#unit-quiz-' + ui + ' .unit-quiz-content');
  if (contentEl) {
    contentEl.innerHTML = renderUnitQuiz(ui);
  }
}

// ============================================================
// 开始测试（支持断点续答）
// ============================================================
function startQuiz(mode) {
  var session = loadSession(mode);
  
  if (session && session.current < session.questions.length) {
    quizState.mode = mode;
    quizState.round = session.round;
    quizState.questions = session.questions;
    quizState.current = session.current;
    quizState.score = session.score;
    quizState.results = session.results;
    quizState.answered = session.answered;
    quizState.selectedAnswer = session.selectedAnswer;
    
    document.getElementById('quizIntro').style.display = 'none';
    document.getElementById('quizArea').classList.add('active');
    renderQuestionFromState();
    return;
  }
  
  var round = getRound(mode);
  quizState = {
    mode: mode, round: round, questions: [], current: 0, score: 0,
    answered: false, results: [], selectedAnswer: null
  };
  
  if (mode === 'comprehensive') {
    var combined = [];
    var modes = ['experiment', 'structure', 'concept', 'phenomenon', 'chart'];
    var counts = [5, 5, 5, 5, 5];
    for (var mi = 0; mi < modes.length; mi++) {
      var m = modes[mi];
      var pool = QUESTIONS[m]['round' + round] || QUESTIONS[m].round1;
      combined = combined.concat(shuffle(pool).slice(0, counts[mi]));
    }
    quizState.questions = shuffle(combined);
  } else {
    var pool = QUESTIONS[mode]['round' + round] || QUESTIONS[mode].round1;
    quizState.questions = shuffle(pool.slice());
  }
  
  clearSession(mode);
  saveSession();
  
  document.getElementById('quizIntro').style.display = 'none';
  document.getElementById('quizArea').classList.add('active');
  renderQuestion();
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function backToModes() {
  if (quizState.questions && quizState.questions.length > 0 && quizState.current < quizState.questions.length) {
    saveSession();
  }
  document.getElementById('quizArea').classList.remove('active');
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('quizIntro').style.display = 'block';
  renderModes();
}

// ============================================================
// 渲染题目
// ============================================================
function renderQuestion() {
  var q = quizState.questions[quizState.current];
  var total = quizState.questions.length;
  var progress = (quizState.current / total) * 100;
  quizState.answered = false;
  quizState.selectedAnswer = null;
  
  renderQuestionUI(q, total, progress, false);
  saveSession();
}

function renderQuestionFromState() {
  var q = quizState.questions[quizState.current];
  var total = quizState.questions.length;
  var progress = (quizState.current / total) * 100;
  
  renderQuestionUI(q, total, progress, true);
  
  if (quizState.answered) {
    revealAnswer(q);
  } else {
    if (quizState.selectedAnswer !== null && q.options) {
      var opts = document.querySelectorAll('.q-option');
      if (opts[quizState.selectedAnswer]) {
        opts[quizState.selectedAnswer].classList.add('selected');
      }
      document.getElementById('submitBtn').disabled = false;
    }
  }
}

function renderQuestionUI(q, total, progress, fromState) {
  var qType = quizState.mode;
  if (quizState.mode === 'comprehensive') {
    // 根据题目来源推断类型
    if (q.q.indexOf('实验') >= 0 || q.q.indexOf('探究') >= 0) qType = 'experiment';
    else if (q.q.indexOf('错误') >= 0 || q.q.indexOf('找出来') >= 0) qType = 'concept';
    else if (q.q.indexOf('现象') >= 0 || q.q.indexOf('原因') >= 0) qType = 'phenomenon';
    else if (q.q.indexOf('下图') >= 0 || q.q.indexOf('表') >= 0 || q.q.indexOf('曲线') >= 0) qType = 'chart';
    else qType = 'structure';
  }
  
  var badges = {
    experiment: ['badge-experiment', '实验探究'],
    structure: ['badge-structure', '结构辨识'],
    concept: ['badge-concept', '概念辨析'],
    phenomenon: ['badge-phenomenon', '现象推理'],
    chart: ['badge-chart', '图表分析']
  };
  var bd = badges[qType] || badges.experiment;
  
  var html = '';
  html += '<button class="back-btn" onclick="backToModes()">&larr; 返回模式选择</button>';
  html += '<div class="quiz-header-bar">';
  html += '<span class="quiz-mode-title">' + MODE_NAMES[quizState.mode] + '</span>';
  html += '<span class="quiz-round-badge">第 ' + quizState.round + ' 轮</span>';
  html += '</div>';
  
  html += '<div class="quiz-topbar">';
  html += '<div class="quiz-progress"><div class="quiz-progress-bar" style="width:' + progress + '%"></div></div>';
  html += '<div class="quiz-stats">';
  html += '<span class="stat-item">第 <strong>' + (quizState.current + 1) + '</strong>/' + total + ' 题</span>';
  html += '<span class="stat-item score">得分 <strong>' + quizState.score + '</strong></span>';
  html += '</div></div>';
  
  html += '<div class="question-card">';
  html += '<span class="q-type-badge ' + bd[0] + '">' + bd[1] + '</span>';
  if (q.source) html += '<div class="q-source">' + q.source + '</div>';
  if (q.table) html += '<div class="q-scenario">&#128202; 表格数据：' + q.table + '</div>';
  html += '<div class="q-text">' + q.q + '</div>';
  
  if (q.options) {
    html += '<div class="q-options">';
    for (var i = 0; i < q.options.length; i++) {
      html += '<div class="q-option" data-idx="' + i + '" onclick="selectOption(' + i + ')">';
      html += '<div class="opt-label">' + 'ABCD'.charAt(i) + '</div>';
      html += '<div class="opt-text">' + q.options[i] + '</div>';
      html += '</div>';
    }
    html += '</div>';
  }
  
  html += '<div class="feedback" id="feedback"></div>';
  html += '<div class="btn-row">';
  html += '<button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>确认</button>';
  html += '<button class="btn btn-secondary" id="nextBtn" onclick="nextQuestion()" style="display:none;">下一题 &raquo;</button>';
  html += '</div>';
  html += '</div>';
  
  document.getElementById('quizArea').innerHTML = html;
}

// ============================================================
// 交互逻辑
// ============================================================
function selectOption(idx) {
  if (quizState.answered) return;
  var opts = document.querySelectorAll('.q-option');
  for (var i = 0; i < opts.length; i++) opts[i].classList.remove('selected');
  document.querySelector('.q-option[data-idx="' + idx + '"]').classList.add('selected');
  quizState.selectedAnswer = idx;
  document.getElementById('submitBtn').disabled = false;
  saveSession();
}

function submitAnswer() {
  var q = quizState.questions[quizState.current];
  var isCorrect = false;
  
  if (q.options) {
    if (quizState.selectedAnswer === null) return;
    isCorrect = quizState.selectedAnswer === q.answer;
    var opts = document.querySelectorAll('.q-option');
    for (var i = 0; i < opts.length; i++) {
      opts[i].classList.add('disabled');
      if (i === q.answer) opts[i].classList.add('correct');
      else if (i === quizState.selectedAnswer) opts[i].classList.add('wrong');
    }
  }
  
  quizState.answered = true;
  if (isCorrect) quizState.score += 10;
  
  // 错题收录
  if (!isCorrect && q.options && q.q) {
    var modeNames = { concept:'概念辨识', structure:'结构排序', chart:'功能匹配', experiment:'实验探究', phenomenon:'现象分析', comprehensive:'综合挑战' };
    addWrongQuestion({
      q: q.q,
      options: q.options,
      answer: q.answer,
      userAnswer: quizState.selectedAnswer,
      explain: q.explain || '',
      source: '互动测试-' + (modeNames[quizState.mode] || '练习') + ' 第' + quizState.round + '轮',
      qType: 'choice'
    });
  }
  
  var alreadyRecorded = false;
  for (var ri = 0; ri < quizState.results.length; ri++) {
    if (quizState.results[ri].idx === quizState.current) { alreadyRecorded = true; break; }
  }
  if (!alreadyRecorded) {
    quizState.results.push({ idx: quizState.current, correct: isCorrect, q: q.q });
  }
  
  var fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
  fb.innerHTML = '<div class="fb-title">' + (isCorrect ? '\u2705 回答正确！+10分' : '\u274C 答案有误') + '</div>';
  if (q.explain) fb.innerHTML += '<div class="fb-explain">' + q.explain + '</div>';
  
  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'inline-block';
  
  saveSession();
}

function revealAnswer(q) {
  var result = null;
  for (var i = 0; i < quizState.results.length; i++) {
    if (quizState.results[i].idx === quizState.current) {
      result = quizState.results[i];
      break;
    }
  }
  if (!result) return;
  
  if (q.options && quizState.selectedAnswer !== null) {
    var opts = document.querySelectorAll('.q-option');
    for (var i2 = 0; i2 < opts.length; i2++) {
      opts[i2].classList.add('disabled');
      if (i2 === q.answer) opts[i2].classList.add('correct');
      else if (i2 === quizState.selectedAnswer) opts[i2].classList.add('wrong');
    }
  }
  
  var fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (result.correct ? 'correct' : 'wrong');
  fb.innerHTML = '<div class="fb-title">' + (result.correct ? '\u2705 回答正确！+10分' : '\u274C 答案有误') + '</div>';
  if (q.explain) fb.innerHTML += '<div class="fb-explain">' + q.explain + '</div>';
  
  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'inline-block';
}

function nextQuestion() {
  if (!quizState.answered) return;
  quizState.current++;
  if (quizState.current >= quizState.questions.length) {
    showResult();
  } else {
    quizState.answered = false;
    quizState.selectedAnswer = null;
    renderQuestion();
  }
}

// ============================================================
// 结果页
// ============================================================
function showResult() {
  var total = quizState.questions.length;
  var correct = 0;
  for (var i = 0; i < quizState.results.length; i++) {
    if (quizState.results[i].correct) correct++;
  }
  var percent = Math.round((correct / total) * 100);
  
  var grade = '', msg = '', badges = [];
  if (percent >= 90) { grade = '生物学家'; msg = '你对生物知识的掌握非常扎实，各种题型都难不倒你！'; badges.push('满分达人'); }
  else if (percent >= 75) { grade = '探索达人'; msg = '你的生物知识相当扎实，继续挑战更高难度！'; }
  else if (percent >= 70) { grade = '勤学之士'; msg = '基础不错，达到晋级标准，继续加油！'; }
  else if (percent >= 60) { grade = '初入生门'; msg = '基础尚可，但还没达到晋级标准，再复习一下吧！'; }
  else { grade = '待提升'; msg = '别灰心，回到知识回顾模块再复习一遍，你一定能进步！'; }
  
  if (correct === total) badges.push('全对!');
  if (percent >= 80) badges.push('高手认证');
  
  var upgraded = false;
  if (percent >= 70) {
    upgraded = advanceRound(quizState.mode);
  }
  
  clearSession(quizState.mode);
  
  var html = '<button class="back-btn" onclick="backToModes()">&larr; 返回模式选择</button>';
  html += '<div class="result-card">';
  html += '<div class="result-grade">' + MODE_NAMES[quizState.mode] + ' - 第' + quizState.round + '轮 完成</div>';
  html += '<div class="result-score">' + percent + '<span style="font-size:0.5em;">分</span></div>';
  html += '<div class="result-grade">' + grade + '</div>';
  html += '<div class="result-msg">' + msg + '</div>';
  if (badges.length) {
    html += '<div class="result-badges">';
    for (var b = 0; b < badges.length; b++) html += '<span class="badge">' + badges[b] + '</span>';
    html += '</div>';
  }
  if (upgraded) {
    html += '<div class="round-upgrade">&#11088; 恭喜解锁第' + (quizState.round + 1) + '轮！题目难度升级，全新挑战等你！</div>';
  } else if (percent >= 70 && quizState.round >= TOTAL_ROUNDS) {
    html += '<div class="round-upgrade" style="background:rgba(129,199,132,0.1);border-color:var(--leaf);color:var(--leaf);">&#127942; 你已通关全部' + TOTAL_ROUNDS + '轮挑战！你已达到最高难度！</div>';
  } else if (percent < 70) {
    html += '<div class="round-upgrade" style="background:rgba(239,83,80,0.1);border-color:var(--crimson);color:var(--crimson);">&#128161; 提示：达到70分以上可解锁下一轮更难的题目，加油！</div>';
  }
  html += '<div class="result-detail">';
  html += '<div class="result-row"><span>总题数</span><span>' + total + ' 题</span></div>';
  html += '<div class="result-row"><span>答对</span><span>' + correct + ' 题</span></div>';
  html += '<div class="result-row"><span>答错</span><span>' + (total - correct) + ' 题</span></div>';
  html += '<div class="result-row"><span>得分</span><span>' + quizState.score + ' 分</span></div>';
  html += '<div class="result-row"><span>当前轮次</span><span>第 ' + quizState.round + ' 轮</span></div>';
  html += '</div>';
  html += '<div class="btn-row" style="justify-content:center;">';
  html += '<button class="btn btn-primary" onclick="retryQuiz()">再来一次</button>';
  html += '<button class="btn btn-secondary" onclick="backToModes()">返回选择模式</button>';
  html += '</div></div>';
  
  document.getElementById('quizArea').innerHTML = html;
  saveStats(percent, correct, total, quizState.mode, quizState.round);
}

function retryQuiz() { 
  clearSession(quizState.mode);
  startQuiz(quizState.mode); 
}

// ============================================================
// 统计
// ============================================================
function saveStats(percent, correct, total, mode, round) {
  var d = loadAllData();
  d.stats.push({ date: new Date().toLocaleString(), percent: percent, correct: correct, total: total, mode: MODE_NAMES[mode], round: round });
  if (d.stats.length > 30) d.stats = d.stats.slice(-30);
  saveAllData(d);
  renderStats();
}

function renderStats() {
  var d = loadAllData();
  var stats = d.stats || [];
  var container = document.getElementById('statsContent');
  if (!stats.length) {
    container.innerHTML = '<p style="color:var(--muted);">完成测试后，你的成绩和知识点掌握情况将在这里展示。</p>';
    return;
  }
  
  var sum = 0, best = 0;
  for (var i = 0; i < stats.length; i++) {
    sum += stats[i].percent;
    if (stats[i].percent > best) best = stats[i].percent;
  }
  var avg = Math.round(sum / stats.length);
  
  var html = '<div class="result-detail">';
  html += '<div class="result-row"><span>挑战次数</span><span>' + stats.length + ' 次</span></div>';
  html += '<div class="result-row"><span>平均得分</span><span>' + avg + ' 分</span></div>';
  html += '<div class="result-row"><span>最高得分</span><span>' + best + ' 分</span></div>';
  
  var p = d.rounds || {};
  html += '<div class="result-row"><span>实验探究</span><span>第' + (p.experiment || 1) + '轮</span></div>';
  html += '<div class="result-row"><span>结构辨识</span><span>第' + (p.structure || 1) + '轮</span></div>';
  html += '<div class="result-row"><span>概念辨析</span><span>第' + (p.concept || 1) + '轮</span></div>';
  html += '<div class="result-row"><span>现象推理</span><span>第' + (p.phenomenon || 1) + '轮</span></div>';
  html += '<div class="result-row"><span>图表分析</span><span>第' + (p.chart || 1) + '轮</span></div>';
  html += '<div class="result-row"><span>综合应用</span><span>第' + (p.comprehensive || 1) + '轮</span></div>';
  html += '</div>';
  
  html += '<h3 style="color:var(--accent);margin:24px 0 12px;font-size:1em;">最近记录</h3>';
  html += '<div style="max-width:500px;">';
  var start = Math.max(0, stats.length - 10);
  for (var j = stats.length - 1; j >= start; j--) {
    var r = stats[j];
    var color = r.percent >= 80 ? 'var(--leaf)' : (r.percent >= 60 ? 'var(--amber)' : 'var(--crimson)');
    html += '<div class="result-row"><span>' + r.mode + ' 第' + r.round + '轮 - ' + r.date + '</span><span style="color:' + color + ';">' + r.percent + '分</span></div>';
  }
  html += '</div>';
  
  container.innerHTML = html;
}

// ============================================================
// 导航
// ============================================================
function switchTab(tabName) {
  var btns = document.querySelectorAll('.nav-btn');
  var secs = document.querySelectorAll('.section');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.remove('active');
    if (btns[i].getAttribute('data-tab') === tabName) btns[i].classList.add('active');
  }
  for (var j = 0; j < secs.length; j++) {
    secs[j].classList.remove('active');
    if (secs[j].id === tabName) secs[j].classList.add('active');
  }
  if (tabName === 'quiz') renderModes();
  if (tabName === 'stats') renderStats();
}

// ============================================================
// 初始化
// ============================================================
renderReview();
renderModes();
renderStats();
</script>
