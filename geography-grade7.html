// ============================================================
// 数据持久化（进度、答题状态）
// ============================================================
function loadAllData() {
  try {
    var s = localStorage.getItem(STORAGE_KEY);
    if (s) return JSON.parse(s);
  } catch(e) {}
  return {
    rounds: { map: 1, reason: 1, calc: 1, chart: 1, compare: 1, comprehensive: 1 },
    stats: [],
    sessions: {}
  };
}

function saveAllData(d) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch(e) {}
}

function getRound(mode) {
  var d = loadAllData();
  return d.rounds[mode] || 1;
}

function advanceRound(mode) {
  var d = loadAllData();
  if (d.rounds[mode] < TOTAL_ROUNDS) {
    d.rounds[mode]++;
    saveAllData(d);
    return true;
  }
  return false;
}

function saveSession() {
  var d = loadAllData();
  d.sessions[quizState.mode] = {
    round: quizState.round,
    current: quizState.current,
    score: quizState.score,
    questions: quizState.questions,
    results: quizState.results,
    answered: quizState.answered,
    selectedAnswer: quizState.selectedAnswer
  };
  saveAllData(d);
}

function loadSession(mode) {
  var d = loadAllData();
  return d.sessions[mode] || null;
}

function clearSession(mode) {
  var d = loadAllData();
  delete d.sessions[mode];
  saveAllData(d);
}

function hasUnfinishedSession(mode) {
  var s = loadSession(mode);
  if (!s) return false;
  return s.current < s.questions.length;
}

// ============================================================
function renderModes() {
  var modes = ['map', 'reason', 'calc', 'chart', 'compare', 'comprehensive'];
  var html = '';
  for (var i = 0; i < modes.length; i++) {
    var mode = modes[i];
    var round = getRound(mode);
    var count = 10;
    var roundLabel = round <= TOTAL_ROUNDS ? '第' + round + '轮' : '已通关';
    var hasSession = hasUnfinishedSession(mode);
    
    html += '<div class="mode-card" onclick="startQuiz(\'' + mode + '\')">';
    if (hasSession) {
      html += '<span class="mode-progress-tag">继续作答</span>';
    }
    html += '<div class="mode-icon">' + MODE_ICONS[mode] + '</div>';
    html += '<div class="mode-name">' + MODE_NAMES[mode] + '</div>';
    html += '<div class="mode-desc">' + MODE_DESCS[mode] + '</div>';
    html += '<div class="mode-count">' + count + '题/轮</div>';
    html += '<div class="mode-round">' + roundLabel + '</div>';
    html += '</div>';
  }
  document.getElementById('quizModes').innerHTML = html;
}

// ============================================================
// 单元小结测试 - 渲染与交互
// ============================================================
var unitQuizState = {};

function toggleUnitQuiz(ui) {
  var el = document.getElementById('unit-quiz-' + ui);
  if (el) el.classList.toggle('open');
}

function initUnitQuizState(ui) {
  if (!unitQuizState[ui]) {
    var quiz = UNIT_QUIZ[ui];
    var answers = [];
    var submitted = [];
    for (var i = 0; i < quiz.questions.length; i++) {
      answers.push(null);
      submitted.push(false);
    }
    unitQuizState[ui] = { answers: answers, submitted: submitted, score: 0 };
  }
}

function renderUnitQuiz(ui) {
  initUnitQuizState(ui);
  var quiz = UNIT_QUIZ[ui];
  var state = unitQuizState[ui];
  var html = '';
  
  for (var qi = 0; qi < quiz.questions.length; qi++) {
    var q = quiz.questions[qi];
    html += '<div class="uq-card" id="uq-card-' + ui + '-' + qi + '">';
    html += '<span class="uq-type-badge uq-' + q.type + '">' + q.typeLabel + '</span>';
    html += '<div class="uq-source">' + q.source + '</div>';
    
    if (q.type === 'material' && q.material) {
      html += '<div class="uq-material-text">' + q.material + '</div>';
    }
    
    html += '<div class="uq-question">' + (qi + 1) + '. ' + q.q + '</div>';
    
    if (q.type === 'choice' || q.type === 'material' || q.type === 'comprehensive') {
      html += '<div class="uq-options">';
      for (var oi = 0; oi < q.options.length; oi++) {
        var optClass = 'uq-option';
        if (state.submitted[qi]) {
          optClass += ' disabled';
          if (oi === q.answer) optClass += ' correct';
          else if (state.answers[qi] === oi) optClass += ' wrong';
        } else if (state.answers[qi] === oi) {
          optClass += ' selected';
        }
        html += '<div class="' + optClass + '" onclick="selectUqOption(' + ui + ',' + qi + ',' + oi + ')">';
        html += '<span class="opt-label">' + String.fromCharCode(65 + oi) + '</span>';
        html += '<span>' + q.options[oi] + '</span></div>';
      }
      html += '</div>';
    } else if (q.type === 'judge') {
      html += '<div class="uq-judge-options">';
      var trueClass = 'uq-judge-btn';
      var falseClass = 'uq-judge-btn';
      if (state.submitted[qi]) {
        trueClass += ' disabled';
        falseClass += ' disabled';
        if (q.answer === true) trueClass += ' correct';
        else falseClass += ' correct';
        if (state.answers[qi] === true && q.answer !== true) trueClass += ' wrong';
        if (state.answers[qi] === false && q.answer !== false) falseClass += ' wrong';
      } else if (state.answers[qi] === true) {
        trueClass += ' selected';
      } else if (state.answers[qi] === false) {
        falseClass += ' selected';
      }
      html += '<button class="' + trueClass + '" onclick="selectUqJudge(' + ui + ',' + qi + ',true)">正确</button>';
      html += '<button class="' + falseClass + '" onclick="selectUqJudge(' + ui + ',' + qi + ',false)">错误</button>';
      html += '</div>';
    }
    
    if (state.submitted[qi]) {
      html += '<div class="uq-explain show"><strong>解析：</strong>' + q.explain + '</div>';
    }
    
    if (!state.submitted[qi] && state.answers[qi] !== null && state.answers[qi] !== undefined) {
      html += '<div style="margin-top:12px;">';
      html += '<button class="btn btn-primary" onclick="submitUqAnswer(' + ui + ',' + qi + ')">提交答案</button>';
      html += '</div>';
    }
    
    html += '</div>';
  }
  
  var correctCount = 0;
  for (var j = 0; j < state.submitted.length; j++) {
    if (state.submitted[j]) {
      var qq = quiz.questions[j];
      if (qq.type === 'judge') {
        if (state.answers[j] === qq.answer) correctCount++;
      } else {
        if (state.answers[j] === qq.answer) correctCount++;
      }
    }
  }
  
  html += '<div class="uq-score-bar">';
  html += '<div class="uq-score-info">已答 <strong>' + correctCount + '</strong> / ' + quiz.questions.length + ' 题正确</div>';
  html += '<button class="uq-reset-btn" onclick="resetUnitQuiz(' + ui + ')">重新测试</button>';
  html += '</div>';
  
  return html;
}

function selectUqOption(ui, qi, oi) {
  initUnitQuizState(ui);
  var state = unitQuizState[ui];
  if (state.submitted[qi]) return;
  state.answers[qi] = oi;
  reRenderUnitQuiz(ui);
}

function selectUqJudge(ui, qi, val) {
  initUnitQuizState(ui);
  var state = unitQuizState[ui];
  if (state.submitted[qi]) return;
  state.answers[qi] = val;
  reRenderUnitQuiz(ui);
}

function submitUqAnswer(ui, qi) {
  initUnitQuizState(ui);
  var state = unitQuizState[ui];
  state.submitted[qi] = true;
  reRenderUnitQuiz(ui);
}

function resetUnitQuiz(ui) {
  unitQuizState[ui] = null;
  initUnitQuizState(ui);
  reRenderUnitQuiz(ui);
}

function reRenderUnitQuiz(ui) {
  var container = document.querySelector('#unit-quiz-' + ui + ' .unit-quiz-content');
  if (container) container.innerHTML = renderUnitQuiz(ui);
}

// ============================================================
// 互动测试 - 核心逻辑
// ============================================================
var quizState = {};

function startQuiz(mode) {
  var session = loadSession(mode);
  
  if (session && session.current < session.questions.length) {
    quizState.mode = mode;
    quizState.round = session.round;
    quizState.questions = session.questions;
    quizState.current = session.current;
    quizState.score = session.score;
    quizState.results = session.results;
    quizState.answered = session.answered;
    quizState.selectedAnswer = session.selectedAnswer;
    
    document.getElementById('quizIntro').style.display = 'none';
    document.getElementById('quizArea').classList.add('active');
    renderQuestionFromState();
    return;
  }
  
  var round = getRound(mode);
  quizState = {
    mode: mode, round: round, questions: [], current: 0, score: 0,
    answered: false, results: [], selectedAnswer: null
  };
  
  var pool = QUESTIONS[mode]['round' + round] || QUESTIONS[mode].round1;
  quizState.questions = shuffle(pool.slice());
  
  clearSession(mode);
  saveSession();
  
  document.getElementById('quizIntro').style.display = 'none';
  document.getElementById('quizArea').classList.add('active');
  renderQuestion();
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function backToModes() {
  if (quizState.questions && quizState.questions.length > 0 && quizState.current < quizState.questions.length) {
    saveSession();
  }
  document.getElementById('quizArea').classList.remove('active');
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('quizIntro').style.display = 'block';
  renderModes();
}

function renderQuestion() {
  var q = quizState.questions[quizState.current];
  var total = quizState.questions.length;
  var progress = (quizState.current / total) * 100;
  quizState.answered = false;
  quizState.selectedAnswer = null;
  
  renderQuestionUI(q, total, progress);
  saveSession();
}

function renderQuestionFromState() {
  var q = quizState.questions[quizState.current];
  var total = quizState.questions.length;
  var progress = (quizState.current / total) * 100;
  
  renderQuestionUI(q, total, progress);
  
  if (quizState.answered) {
    revealAnswer(q);
  } else {
    if (quizState.selectedAnswer !== null && q.options) {
      var opts = document.querySelectorAll('.q-option');
      if (opts[quizState.selectedAnswer]) {
        opts[quizState.selectedAnswer].classList.add('selected');
      }
      document.getElementById('submitBtn').disabled = false;
    }
  }
}

function renderQuestionUI(q, total, progress) {
  var badgeMap = {
    map: ['badge-map', '读图定位'],
    reason: ['badge-reason', '现象推理'],
    calc: ['badge-calc', '数据计算'],
    chart: ['badge-chart', '图表判读'],
    compare: ['badge-compare', '区域对比'],
    comprehensive: ['badge-map', '综合探究']
  };
  var bd = badgeMap[quizState.mode] || badgeMap.map;
  
  var html = '';
  html += '<button class="back-btn" onclick="backToModes()">&larr; 返回模式选择</button>';
  html += '<div class="quiz-header-bar">';
  html += '<span class="quiz-mode-title">' + MODE_NAMES[quizState.mode] + '</span>';
  html += '<span class="quiz-round-badge">第 ' + quizState.round + ' 轮</span>';
  html += '</div>';
  
  html += '<div class="quiz-topbar">';
  html += '<div class="quiz-progress"><div class="quiz-progress-bar" style="width:' + progress + '%"></div></div>';
  html += '<div class="quiz-stats">';
  html += '<span class="stat-item">第 <strong>' + (quizState.current + 1) + '</strong>/' + total + ' 题</span>';
  html += '<span class="stat-item score">得分 <strong>' + quizState.score + '</strong></span>';
  html += '</div></div>';
  
  html += '<div class="question-card">';
  html += '<span class="q-type-badge ' + bd[0] + '">' + bd[1] + '</span>';
  if (q.source) html += '<div class="q-source">' + q.source + '</div>';
  if (q.scenario) html += '<div class="q-scenario">\u270D ' + q.scenario + '</div>';
  html += '<div class="q-text">' + q.q + '</div>';
  
  if (q.options) {
    html += '<div class="q-options">';
    for (var i = 0; i < q.options.length; i++) {
      html += '<div class="q-option" onclick="selectOption(' + i + ')">';
      html += '<span class="opt-label">' + String.fromCharCode(65 + i) + '</span>';
      html += '<span class="opt-text">' + q.options[i] + '</span></div>';
    }
    html += '</div>';
  }
  
  html += '<div class="feedback" id="feedback">';
  html += '<div class="fb-title" id="fbTitle"></div>';
  html += '<div class="fb-explain" id="fbExplain"></div>';
  html += '</div>';
  
  html += '<div class="btn-row">';
  html += '<button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>提交答案</button>';
  html += '<button class="btn btn-secondary" id="nextBtn" onclick="nextQuestion()" style="display:none;">下一题 &rarr;</button>';
  html += '</div>';
  
  html += '</div>';
  
  document.getElementById('quizArea').innerHTML = html;
}

function selectOption(idx) {
  if (quizState.answered) return;
  quizState.selectedAnswer = idx;
  
  var opts = document.querySelectorAll('.q-option');
  for (var i = 0; i < opts.length; i++) {
    opts[i].classList.remove('selected');
  }
  opts[idx].classList.add('selected');
  document.getElementById('submitBtn').disabled = false;
  saveSession();
}

function submitAnswer() {
  if (quizState.answered || quizState.selectedAnswer === null) return;
  quizState.answered = true;
  
  var q = quizState.questions[quizState.current];
  var isCorrect = quizState.selectedAnswer === q.answer;
  
  if (isCorrect) {
    quizState.score += 10;
    quizState.results.push(true);
  } else {
    quizState.results.push(false);
  }
  
  revealAnswer(q);
  saveSession();
}

function revealAnswer(q) {
  var opts = document.querySelectorAll('.q-option');
  var correctIdx = q.answer;
  var selectedIdx = quizState.selectedAnswer;
  
  for (var i = 0; i < opts.length; i++) {
    opts[i].classList.add('disabled');
    if (i === correctIdx) {
      opts[i].classList.add('correct');
    } else if (i === selectedIdx && selectedIdx !== correctIdx) {
      opts[i].classList.add('wrong');
    }
  }
  
  var fb = document.getElementById('feedback');
  var fbTitle = document.getElementById('fbTitle');
  var fbExplain = document.getElementById('fbExplain');
  
  var isCorrect = selectedIdx === correctIdx;
  if (isCorrect) {
    fb.className = 'feedback show correct';
    fbTitle.textContent = '\u2714 回答正确！';
  } else {
    fb.className = 'feedback show wrong';
    fbTitle.textContent = '\u2718 回答错误';
  }
  fbExplain.textContent = q.explain;
  
  document.getElementById('submitBtn').style.display = 'none';
  var nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'inline-block';
  
  if (quizState.current === quizState.questions.length - 1) {
    nextBtn.textContent = '查看结果 \u2192';
  }
}

function nextQuestion() {
  if (quizState.current < quizState.questions.length - 1) {
    quizState.current++;
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  var total = quizState.questions.length;
  var score = quizState.score;
  var percent = Math.round(score / (total * 10) * 100);
  
  var grade = '';
  var msg = '';
  var badges = [];
  
  if (percent >= 90) {
    grade = '地理达人';
    msg = '太棒了！你的地理知识非常扎实，继续保持！';
    badges.push('\ud83c\udfc6 满分达人');
  } else if (percent >= 80) {
    grade = '优秀';
    msg = '表现不错！再接再厉，争取更好成绩！';
    badges.push('\ud83c\udf1f 优秀学员');
  } else if (percent >= 70) {
    grade = '良好';
    msg = '基础不错，还有提升空间，继续加油！';
    badges.push('\ud83d\udcda 学习能手');
  } else if (percent >= 60) {
    grade = '及格';
    msg = '勉强过关，需要加强复习哦！';
    badges.push('\ud83d\udcc8 进步空间大');
  } else {
    grade = '需努力';
    msg = '要多复习知识点，再来挑战吧！';
    badges.push('\ud83d\udcaa 加油！');
  }
  
  var correctCount = 0;
  for (var i = 0; i < quizState.results.length; i++) {
    if (quizState.results[i]) correctCount++;
  }
  
  var advanced = false;
  if (percent >= 70 && quizState.round < TOTAL_ROUNDS) {
    advanced = advanceRound(quizState.mode);
  }
  
  // 保存统计
  var d = loadAllData();
  d.stats.push({
    mode: quizState.mode,
    modeName: MODE_NAMES[quizState.mode],
    round: quizState.round,
    score: score,
    total: total,
    percent: percent,
    time: new Date().toLocaleString()
  });
  saveAllData(d);
  
  var html = '';
  html += '<button class="back-btn" onclick="backToModes()">&larr; 返回模式选择</button>';
  html += '<div class="result-card">';
  html += '<h2 style="color:var(--cyan);margin-bottom:8px;">测试完成！</h2>';
  html += '<div class="result-grade">' + grade + '</div>';
  html += '<div class="result-score">' + score + ' 分</div>';
  html += '<div class="result-msg">' + msg + '</div>';
  html += '<div class="result-badges">';
  for (var b = 0; b < badges.length; b++) {
    html += '<span class="badge">' + badges[b] + '</span>';
  }
  html += '</div>';
  
  html += '<div class="result-detail">';
  html += '<div class="result-row"><span>答题模式</span><span>' + MODE_NAMES[quizState.mode] + '</span></div>';
  html += '<div class="result-row"><span>当前轮次</span><span>第 ' + quizState.round + ' 轮</span></div>';
  html += '<div class="result-row"><span>总题数</span><span>' + total + ' 题</span></div>';
  html += '<div class="result-row"><span>答对题数</span><span>' + correctCount + ' 题</span></div>';
  html += '<div class="result-row"><span>正确率</span><span>' + percent + '%</span></div>';
  html += '</div>';
  
  if (advanced) {
    html += '<div class="round-upgrade">\ud83c\udf89 恭喜！你已解锁第 ' + (quizState.round + 1) + ' 轮，难度升级，等你来挑战！</div>';
  } else if (percent < 70 && quizState.round <= TOTAL_ROUNDS) {
    html += '<div style="margin-top:16px;padding:12px 16px;border-radius:10px;background:rgba(239,83,80,0.1);border:1px solid var(--crimson);color:var(--crimson);font-size:0.9em;">';
    html += '\u26a0\ufe0f 得分低于70分，未能解锁下一轮。复习知识点后再来挑战吧！';
    html += '</div>';
  }
  
  html += '<div class="btn-row" style="justify-content:center;">';
  html += '<button class="btn btn-primary" onclick="retryQuiz()">再测一次</button>';
  html += '<button class="btn btn-secondary" onclick="backToModes()">返回模式选择</button>';
  html += '</div>';
  
  html += '</div>';
  
  document.getElementById('quizArea').innerHTML = html;
  clearSession(quizState.mode);
}

function retryQuiz() {
  var mode = quizState.mode;
  var round = quizState.round;
  quizState = {
    mode: mode, round: round, questions: [], current: 0, score: 0,
    answered: false, results: [], selectedAnswer: null
  };
  
  var pool = QUESTIONS[mode]['round' + round] || QUESTIONS[mode].round1;
  quizState.questions = shuffle(pool.slice());
  
  clearSession(mode);
  saveSession();
  renderQuestion();
}

// ============================================================
// 标签切换
// ============================================================
function switchTab(tab) {
  var tabs = document.querySelectorAll('.nav-btn');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.remove('active');
    if (tabs[i].getAttribute('data-tab') === tab) {
      tabs[i].classList.add('active');
    }
  }
  
  var sections = document.querySelectorAll('.section');
  for (var j = 0; j < sections.length; j++) {
    sections[j].classList.remove('active');
  }
  document.getElementById(tab).classList.add('active');
  
  if (tab === 'stats') {
    renderStats();
  }
}

// ============================================================
// 学习统计
// ============================================================
function renderStats() {
  var d = loadAllData();
  var stats = d.stats || [];
  var html = '';
  
  if (stats.length === 0) {
    html = '<p style="color:var(--muted);">还没有完成任何测试，快去互动测试挑战吧！</p>';
  } else {
    var totalTests = stats.length;
    var totalScore = 0;
    var avgPercent = 0;
    var modeCounts = {};
    
    for (var i = 0; i < stats.length; i++) {
      totalScore += stats[i].score;
      avgPercent += stats[i].percent;
      var mn = stats[i].modeName || stats[i].mode;
      modeCounts[mn] = (modeCounts[mn] || 0) + 1;
    }
    avgPercent = Math.round(avgPercent / totalTests);
    
    html = '<div style="text-align:left;max-width:500px;margin:0 auto;">';
    html += '<div style="margin-bottom:24px;">';
    html += '<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule);">';
    html += '<span style="color:var(--muted);">完成测试次数</span><span style="color:var(--cyan);font-weight:600;">' + totalTests + ' 次</span>';
    html += '</div>';
    html += '<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule);">';
    html += '<span style="color:var(--muted);">累计得分</span><span style="color:var(--accent);font-weight:600;">' + totalScore + ' 分</span>';
    html += '</div>';
    html += '<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule);">';
    html += '<span style="color:var(--muted);">平均正确率</span><span style="color:var(--teal);font-weight:600;">' + avgPercent + '%</span>';
    html += '</div>';
    html += '</div>';
    
    html += '<h3 style="color:var(--cyan);font-size:1em;margin-bottom:12px;">各模式解锁进度</h3>';
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px;">';
    var modes = ['map', 'reason', 'calc', 'chart', 'compare', 'comprehensive'];
    for (var m = 0; m < modes.length; m++) {
      var r = d.rounds[modes[m]] || 1;
      var maxR = TOTAL_ROUNDS;
      var pct = Math.min(100, (r / maxR) * 100);
      html += '<div style="background:var(--surface2);border-radius:8px;padding:10px;text-align:center;">';
      html += '<div style="font-size:1.5em;margin-bottom:4px;">' + MODE_ICONS[modes[m]] + '</div>';
      html += '<div style="font-size:0.85em;color:var(--ink);margin-bottom:4px;">' + MODE_NAMES[modes[m]] + '</div>';
      html += '<div style="font-size:0.75em;color:var(--muted);">第' + r + '轮 / 共' + maxR + '轮</div>';
      html += '<div style="height:4px;background:var(--bg2);border-radius:2px;margin-top:6px;">';
      html += '<div style="height:100%;background:var(--cyan);border-radius:2px;width:' + pct + '%;"></div>';
      html += '</div></div>';
    }
    html += '</div>';
    
    html += '<h3 style="color:var(--cyan);font-size:1em;margin-bottom:12px;">最近测试记录</h3>';
    html += '<div style="max-height:240px;overflow-y:auto;">';
    var recent = stats.slice(-10).reverse();
    for (var k = 0; k < recent.length; k++) {
      html += '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule);font-size:0.85em;">';
      html += '<div><span style="color:var(--ink);">' + recent[k].modeName + '</span> <span style="color:var(--muted);font-size:0.8em;">第' + recent[k].round + '轮</span></div>';
      html += '<span style="color:var(--accent);">' + recent[k].score + '分 (' + recent[k].percent + '%)</span>';
      html += '</div>';
    }
    html += '</div>';
    
    html += '<div style="margin-top:20px;text-align:center;">';
    html += '<button class="btn btn-secondary" onclick="clearAllStats()">清空记录</button>';
    html += '</div>';
    
    html += '</div>';
  }
  
  document.getElementById('statsContent').innerHTML = html;
}

function clearAllStats() {
  if (!confirm('确定要清空所有学习记录吗？此操作不可恢复。')) return;
  var d = loadAllData();
  d.stats = [];
  d.rounds = { map: 1, reason: 1, calc: 1, chart: 1, compare: 1, comprehensive: 1 };
  d.sessions = {};
  saveAllData(d);
  renderStats();
  renderModes();
}

// ============================================================
// 页面初始化
// ============================================================
window.onload = function() {
  renderReview();
  renderModes();
};
</script>
