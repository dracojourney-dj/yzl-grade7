        options:['确实，环卫工人的工作没什么价值','只有伟人才是伟大的，普通人没什么了不起','生命虽然平凡，但也能时时创造伟大。你爸爸用劳动为社会做贡献，同样值得尊敬','你应该换个有出息的爸爸'],
        answer: 2,
        explain:'与伟人相比，更多的人可能是默默无闻的。当人们为生活而努力，为家庭的美好和社会的发展贡献自己的力量时，就是在用认真、勤劳、善良、坚持、责任、勇敢书写自己的生命价值。环卫工人用劳动创造社会价值，同样值得尊敬。' }
    ],
    round2: [
      { source:'改编自深圳中考模拟（情境型）',
        q:'情境：小闽和小福是好朋友。最近，小闽发现小福经常偷偷去网吧打游戏，还让小闽帮他保密，不要告诉老师和家长。\n\n小闽应该怎么做？',
        options:['帮小福保密，这才是朋友应该做的','劝小福不要去网吧，如果不听就告诉老师或家长','跟着小福一起去，反正朋友去哪我去哪','和小福绝交，这种朋友不能交'],
        answer: 1,
        explain:'友谊不能没有原则。当朋友误入歧途时，不予规劝甚至推波助澜，反而会伤害朋友、伤害友谊。正确的做法是先劝阻，如果不听就告诉老师或家长，这才是对朋友真正的负责。' },
      { source:'改编自深圳期末真题（情境型）',
        q:'情境：进入初中后，小福的学习成绩有所下降。他很着急，每天学到很晚，不停地刷题，但效果并不好。他很困惑：为什么我这么努力还是学不好？\n\n下列建议中，你认为最有效的是：',
        options:['继续熬夜刷题，勤能补拙','掌握科学的学习方法，合理安排时间，提高学习效率','放弃学习，反正学不好','抄同学的作业，这样成绩就上去了'],
        answer: 1,
        explain:'学会学习，需要掌握科学的学习方法。学习意味着要善于从生活中汲取养料，掌握一些基本的学习策略，合理安排学习时间，养成良好的学习习惯，不断提升自己的学习能力。适合自己的方法就是最好的方法。' },
      { source:'改编自广东中考真题（情境型）',
        q:'情境：小闽的妈妈最近工作很忙，回家还要做家务、照顾小闽的弟弟。小闽觉得妈妈只关心弟弟，不关心自己，心里很不平衡。\n\n如果你是小闽，你会怎么做？',
        options:['和妈妈大吵大闹，让妈妈只关心自己','理解妈妈的辛苦，主动分担家务，关心妈妈和弟弟','离家出走，让妈妈后悔','把弟弟扔掉，这样妈妈就只关心自己了'],
        answer: 1,
        explain:'作为两代人，我们与父母在心智、学识、经历等方面差异较大，对问题的理解、感受等方面必然存在差异，亲子冲突有时难以避免。但我们要试着去接纳父母的做法，理解父母行为中蕴含的爱。同时，我们也要关心父母，主动分担家务。' },
      { source:'改编自深圳一模真题（情境型）',
        q:'情境：小福很喜欢画画，经常在课堂上偷偷画画，影响了听课。美术老师发现了他的天赋，鼓励他参加美术兴趣小组，但也提醒他要认真听其他课。\n\n小福应该怎样做更好的自己？',
        options:['只学画画，其他课不用听了','扬长避短，发挥画画的特长，同时也要认真学习其他课程','反正我只有画画好，其他都学不好，放弃了','把画画放弃，专心学习文化课'],
        answer: 1,
        explain:'做更好的自己，就要扬长避短。要善于利用自己的优点和长处，最大限度地展现自己的才华。但同时也要主动改正缺点，全面发展。A、C是偏科的表现；D忽视了自己的特长。' },
      { source:'改编自教材情境题（情境型）',
        q:'情境：小闽参加了学校组织的演讲比赛，因为紧张发挥失常，没有拿到名次。他很伤心，觉得自己太没用了。\n\n你会怎样安慰小闽？',
        options:['你确实很没用，连个演讲比赛都搞不定','一次失败不算什么，我们要正确对待挫折，及时总结经验，下次会更好','别难过了，反正你也不擅长演讲，放弃吧','都是评委的问题，他们不懂欣赏'],
        answer: 1,
        explain:'面对挫折，我们可能会感到失落、难过、不满等，这是正常的。但我们需要及时调整自己，正确对待挫折。生活中的挫折是我们生命成长的一部分。得意时，挫折使我们更清醒；失意时，挫折使我们获得更丰富的生活经验。' },
      { source:'改编自深圳期末真题（情境型）',
        q:'情境：小福的爸爸因为车祸去世了，小福非常悲痛，整天以泪洗面，不吃不喝，也不去上学。\n\n你想对小福说什么？',
        options:['人死不能复生，哭也没用，别难过了','我们每个人都难以抗拒生命发展的自然规律。悲伤是正常的，但也要学会慢慢走出悲痛，好好活着，这也是对亲人最好的纪念','你怎么这么脆弱，不就是死了爸爸吗','我也不知道说什么，让他自己待着吧'],
        answer: 1,
        explain:'死亡是人生不可避免的归宿。面对亲人离世，悲痛是正常的情感反应。但我们也要学会慢慢走出悲痛，因为生命还在继续，好好活着、活出精彩，才是对逝去亲人最好的纪念。A、C不尊重他人的情感；D不够关怀。' },
      { source:'改编自广东中考真题（情境型）',
        q:'情境：小闽在网上看到有人说「生命是自己的，我想怎样就怎样，别人管不着」。\n\n你认同这种观点吗？为什么？',
        options:['认同，生命是自己的，自己说了算','不认同。生命至上，并不意味着只看到自己生命的重要性，我们也必须承认别人的生命同样重要。而且生命不仅是「我」的生命，还是「我们」的生命','认同，别人无权干涉我的自由','不认同，因为生命是父母给的，所以应该听父母的'],
        answer: 1,
        explain:'生命至上，并不意味着只看到自己生命的重要性，我们也必须承认别人的生命同样重要。在生命的接续中，每个人的生命不仅仅是「我」的生命，还是「我们」的生命。我们不能随意放弃自己的生命，因为这不仅仅是个人的事，也关系到家人和社会。' },
      { source:'改编自深圳二模真题（情境型）',
        q:'情境：小福的爷爷今年70多岁了，身体不太好。小福觉得爷爷老了，没用了，还经常给家里添麻烦。\n\n你想对小福说什么？',
        options:['确实，老人老了就是累赘','生命是脆弱的，但也是坚强的。我们要敬畏生命，关爱老人，孝亲敬长','老人没用了，不用管他','等我老了我就自己了断，不给孩子添麻烦'],
        answer: 1,
        explain:'生命是脆弱的、艰难的，但也是坚强的、有力量的，是崇高的、神圣的。我们要敬畏生命，尊重每一个生命。孝亲敬长是中华民族的传统美德，也是每个公民的法定义务。我们要关爱老人，用行动表达孝敬之心。' },
      { source:'改编自教材探究题（情境型）',
        q:'情境：小闽最近很迷茫：「我学习不好，体育也不好，什么都不会，我活着有什么意义呢？」\n\n你想对小闽说什么？',
        options:['确实，你这样的人活着没什么意义','探索生命意义，是人类生命的原动力之一。生命是独特的，生命意义是具体的。每个人都可以通过自己的努力发现和创造生命的意义','你这么想很正常，很多人都这么觉得','别想那么多，混日子就行了'],
        answer: 1,
        explain:'探索生命意义，是人类生命的原动力之一。生命是独特的，生命意义是具体的。每个人的生活不尽相同，我们都是在自己的生活经历中一点一点地建构自己，形成「我的人生」。生命的意义需要自己发现和创造。' },
      { source:'改编自深圳期末真题（情境型）',
        q:'情境：小福是一个很普通的学生，成绩一般，长相一般，家庭也普通。他觉得自己很平凡，人生不可能有什么精彩。\n\n你想对小福说什么？',
        options:['平凡的人就是这样，没什么精彩可言','生命虽然平凡，但也能时时创造伟大。当我们为生活而努力，为家庭的美好和社会的发展贡献自己的力量时，就是在书写自己的生命价值','只有伟人的人生才精彩，普通人就认命吧','想要精彩就要不择手段地往上爬'],
        answer: 1,
        explain:'与伟人相比，更多的人可能是默默无闻的。当人们为生活而努力，日复一日，年复一年，面对生活的艰难考验，不放弃、不懈怠，为家庭的美好和社会的发展贡献自己的力量时，就是在用认真、勤劳、善良、坚持、责任、勇敢书写自己的生命价值。生命虽然平凡，但也能时时创造伟大。' }
    ],
    round3: [
      { source:'改编自深圳中考（综合情境型）',
        q:'情境：小闽和小福从小学就是好朋友。进入初中后，小闽认识了很多新朋友，和小福的关系好像变淡了。小福很难过，觉得小闽背叛了自己。\n\n下列说法正确的是：',
        options:['小闽不应该交新朋友，这样是对朋友的背叛','友谊不是一成不变的。我们要学会接受一段友谊的淡出，坦然接受新的友谊','小福应该也去交新朋友，再也不理小闽了','小闽和小福应该绝交'],
        answer: 1,
        explain:'友谊不是一成不变的。自己变了，对方变了，或者环境变了……在这些改变中，有些友谊得到保持，而有些友谊则逐渐淡出。我们要学会接受一段友谊的淡出，坦然接受新的友谊。' },
      { source:'改编自广东中考（材料情境型）',
        q:'情境：小福最近迷上了网络游戏，经常熬夜打游戏，成绩一落千丈。老师找他谈话，他却说：「学习是我自己的事，我想怎样就怎样，你管不着。」\n\n下列对小福的言行评价正确的是：',
        options:['说得对，学习是自己的事，老师管不着','小福的言行是错误的。学习不仅是个人的事，也关系到家庭和社会。而且沉迷网络、不爱惜身体是对自己不负责任的表现','小福说得有道理，老师不应该干涉学生的自由','小福错在不应该当面顶撞老师，但他的想法是对的'],
        answer: 1,
        explain:'学习点亮我们心中的明灯，激发前进的动力。在学习中，我们分享生命经验，获得成长，同时也可以帮助他人，服务社会，为幸福生活奠基。学习不只是个人的事。而且熬夜打游戏、不爱惜身体，是对自己生命不负责任的态度。' },
      { source:'改编自深圳二模（综合情境型）',
        q:'情境：小闽和妈妈吵架了。原因是妈妈偷看了小闽的日记。小闽很生气，说妈妈侵犯了他的隐私；妈妈说：「我是你妈，我看你日记是为了你好！」\n\n下列说法正确的是：',
        options:['妈妈做得对，父母看孩子的天经地义','小闽应该和妈妈冷战，直到妈妈道歉','双方都有不对的地方。妈妈的出发点是好的，但方式不对，侵犯了孩子的隐私；小闽也应该理解妈妈的爱，主动沟通，而不是发脾气','小闽太不懂事了，妈妈都是为了他好'],
        answer: 2,
        explain:'亲子冲突是双方的原因造成的。妈妈的出发点是关心孩子，但方式不对，侵犯了孩子的隐私；小闽的情绪反应也是正常的，但应该理解妈妈的爱，用恰当的方式沟通。爱是需要呵护的，互动沟通的技巧和应对冲突的智慧，是亲子之间爱的润滑剂。' },
      { source:'改编自深圳期末（综合情境型）',
        q:'情境：小福的数学老师换了，新来的老师讲课方式和原来的老师很不一样，小福很不适应，数学课都听不进去，成绩也下降了。\n\n小福应该怎么做？',
        options:['不听了，反正听不懂','要求学校换回原来的老师','承认老师之间的差异，接纳新老师的不同，主动和老师沟通，慢慢适应','上课睡觉，下课自学'],
        answer: 2,
        explain:'由于年龄、学识、阅历、性格、情感与思维方式等差异，每位老师解决问题的方法和表达方式不同，由此呈现出不同的风格。我们要承认老师之间的差异，接纳每位老师的不同，他们身上都有值得我们学习的地方。我们可以主动和老师沟通，慢慢适应新的教学方式。' },
      { source:'改编自广东中考（综合情境型）',
        q:'情境：某班同学开展了一场关于「挫折」的讨论。甲说：「挫折是好事，挫折越多越好。」乙说：「挫折是坏事，挫折越少越好。」\n\n你认为正确的观点是：',
        options:['甲说得对，挫折越多越好','乙说得对，挫折越少越好','挫折既有积极作用，也有消极作用，关键是我们对待挫折的态度','两人说得都对'],
        answer: 2,
        explain:'面对不同的挫折，不同的人会有不同的情绪感受和行为反应。挫折对人的影响具有两面性：消极的一面是让人产生负面情绪；积极的一面是，生活中的挫折是我们生命成长的一部分，得意时使我们更清醒，失意时使我们获得更丰富的生活经验。关键是我们对待挫折的认识和态度。' },
      { source:'改编自深圳一模（综合情境型）',
        q:'情境：小闽的同桌小福家庭条件不好，经常穿破旧的衣服。有的同学嘲笑小福，说他「穷酸」。小闽想帮助小福，但又怕伤害他的自尊心。\n\n下列做法中，最恰当的是：',
        options:['直接把自己的衣服送给小福','和嘲笑小福的同学一起起哄','尊重小福，不歧视他，在他需要帮助的时候用恰当的方式伸出援手','离小福远一点，免得被别人说自己也穷'],
        answer: 2,
        explain:'人与人在相互依存和彼此关切中感受温暖，传递温暖。我们不仅要关注自身的发展，而且要关切他人的生命，设身处地地思考并善待他人。但关怀他人也要注意方式，要尊重对方，不能让对方感到被施舍。' },
      { source:'改编自教材综合情境题',
        q:'情境：小福是一个很有才华的学生，学习好、体育好、画画也好。但他很骄傲，看不起其他同学，觉得别人都不如自己。同学们都不太喜欢他。\n\n你想对小福说什么？',
        options:['你确实很优秀，看不起别人是应该的','欣赏自己，不是骄傲自大，也不是目中无人。我们欣赏自己的同时，也要看到别人的优点，学会欣赏他人','别人嫉妒你，不用管他们','走自己的路，让别人说去吧'],
        answer: 1,
        explain:'我们要学会欣赏自己，欣赏自己的独特、优点、努力和为他人的奉献。但欣赏自己，不是骄傲自大，也不是目中无人。欣赏自己的人，既能展现自己的风采，也能看到他人的美丽；既能为自己鼓掌，也能为他人喝彩。' },
      { source:'改编自深圳期末（综合情境型）',
        q:'情境：地震发生了，学校组织学生捐款捐物支援灾区。小闽说：「我又不认识灾区的人，为什么要捐？」小福说：「生命至上，我们要关怀他人的生命。」\n\n下列说法正确的是：',
        options:['小闽说得对，不认识的人没必要帮','小福说得对，生命至上，我们要自觉地珍爱他人的生命，如同珍爱自己的生命一样','捐不捐是个人自由，无所谓','只有灾区的人才需要帮助，我们身边的人不需要'],
        answer: 1,
        explain:'生命至上，并不意味着只看到自己生命的重要性，我们也必须承认别人的生命同样重要。「仁者爱人」「推己及人」，我们要自觉地珍爱他人的生命，如同珍爱自己的生命一样。人与人在相互依存和彼此关切中感受温暖，传递温暖。' },
      { source:'改编自广东中考（综合情境型）',
        q:'情境：小闽最近在思考一个问题：「人为什么活着？怎样的人生是值得的？」\n\n下列回答中，你认为最全面的是：',
        options:['人活着就是为了吃好喝好享受生活','人活着就是为了出人头地，赚大钱','能够活出自己的人生，自食其力，实现自我价值；当别人需要帮助时付出爱心；能够将个人理想与国家发展、民族复兴和人类命运共同体结合起来——这样的人生是值得的','人活着就是为了传宗接代'],
        answer: 2,
        explain:'怎样的一生是值得的？能够活出自己的人生，自食其力，实现自我价值，这样的一生是值得的；当别人需要帮助时，付出自己的爱心，无论大小，自愿承担责任，这样的一生是值得的；能够将个人理想与国家发展、民族复兴和人类命运共同体结合起来，这样的一生是值得的。' },
      { source:'改编自深圳中考（综合探究情境型）',
        q:'情境：感动中国人物张桂梅，创办了全国第一所全免费女子高中，帮助上千名山区女孩圆了大学梦。她身患多种疾病，却始终坚守在教育一线。有人说她傻，有人说她伟大。\n\n从生命价值的角度，你认为张桂梅校长的人生：',

// 全局状态
// ============================================================
var quizState = {
  mode: null, round: 1, questions: [], current: 0, score: 0,
  answered: false, results: [], selectedAnswer: null,
  matchState: {}, sortState: {}
};

var MODE_NAMES = {
  time: '材料选择', sort: '价值排序', match: '名言解读',
  art: '情境分析', find: '观点辨析', all: '综合探究'
};

var MODE_ICONS = {
  time: '\u270D', sort: '\u2195', match: '\u2696',
  art: '\u{1F4AC}', find: '\u2753', all: '\u2B50'
};

var MODE_DESCS = {
  time: '材料型选择题，中考主力题型',
  sort: '价值排序题，按重要性排序',
  match: '名言解读题，古语与道理匹配',
  art: '情境分析题，生活情境分析',
  find: '观点辨析题，找出错误观点',
  all: '6种真题题型混合，全真模拟'
};

var TOTAL_ROUNDS = 3;
var STORAGE_KEY = 'morality_quiz_grade7_v1';

// ============================================================
// 数据持久化（进度、答题状态）
// ============================================================
function loadAllData() {
  try {
    var s = localStorage.getItem(STORAGE_KEY);
    if (s) return JSON.parse(s);
  } catch(e) {}
  return {
    rounds: { time: 1, sort: 1, match: 1, art: 1, find: 1, all: 1 },
    stats: [],
    sessions: {}
  };
}

function saveAllData(d) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch(e) {}
}

function getRound(mode) {
  var d = loadAllData();
  return d.rounds[mode] || 1;
}

function advanceRound(mode) {
  var d = loadAllData();
  if (d.rounds[mode] < TOTAL_ROUNDS) {
    d.rounds[mode]++;
    saveAllData(d);
    return true;
  }
  return false;
}

function saveSession() {
  var d = loadAllData();
  d.sessions[quizState.mode] = {
    round: quizState.round,
    current: quizState.current,
    score: quizState.score,
    questions: quizState.questions,
    results: quizState.results,
    answered: quizState.answered,
    selectedAnswer: quizState.selectedAnswer,
    matchState: quizState.matchState,
    sortState: quizState.sortState
  };
  saveAllData(d);
}

function loadSession(mode) {
  var d = loadAllData();
  if (d.sessions[mode]) return d.sessions[mode];
  return null;
}

function clearSession(mode) {
  var d = loadAllData();
  delete d.sessions[mode];
  saveAllData(d);
}

function hasUnfinishedSession(mode) {
  var s = loadSession(mode);
  if (!s) return false;
  return s.current < s.questions.length;
}

// ============================================================
// 模式列表渲染
// ============================================================
function renderModes() {
  var container = document.getElementById('quizModes');
  var modes = ['time', 'sort', 'match', 'art', 'find', 'all'];
  var html = '';
  for (var i = 0; i < modes.length; i++) {
    var m = modes[i];
    var round = getRound(m);
    var hasSession = hasUnfinishedSession(m);
    var progressTag = hasSession ? '<span class="mode-progress-tag">继续</span>' : '';
    html += '<div class="mode-card" onclick="startQuiz(\'' + m + '\')">';
    html += progressTag;
    html += '<div class="mode-icon">' + MODE_ICONS[m] + '</div>';
    html += '<div class="mode-name">' + MODE_NAMES[m] + '</div>';
    html += '<div class="mode-desc">' + MODE_DESCS[m] + '</div>';
    html += '<div class="mode-count">3轮进阶 / 每轮10题</div>';
    html += '<span class="mode-round">当前 第' + round + '轮</span>';
    html += '</div>';
  }
  container.innerHTML = html;
}

// ============================================================
// 知识回顾渲染
// ============================================================
function renderReview() {

    html += '<div class="unit-header" onclick="toggleUnit(' + i + ')">';

    html += '<div class="unit-period">' + unit.period + '</div></div>';
    html += '<div class="toggle">+</div></div>';
    html += '<div class="unit-body"><div class="lessons">';

      html += '<div class="point-list">';

        html += '<div class="point-content">' + p.c + '</div>';
        html += '<div class="point-type">常考题型：' + p.type + '</div>';
        html += '</div>';
      }
      html += '</div></div>';

function toggleUnit(ui) {
  var card = document.querySelectorAll('.unit-card')[ui];
  card.classList.toggle('open');
}

function toggleLesson(ui, li) {
  var unitCard = document.querySelectorAll('.unit-card')[ui];
  var lessonBlock = unitCard.querySelectorAll('.lesson-block')[li];
  lessonBlock.classList.toggle('open');
}

function toggleUnitQuiz(ui) {
  var section = document.getElementById('uq-' + ui);
  section.classList.toggle('open');
  if (section.classList.contains('open')) {
    initUnitQuizState(ui);
    renderUnitQuiz(ui);
  }
}

// ============================================================
// 单元小结测试逻辑
// ============================================================
function initUnitQuizState(ui) {
  if (unitQuizState[ui]) return;
  var unitQuiz = UNIT_QUIZ[ui];
  unitQuizState[ui] = {
    answers: new Array(unitQuiz.questions.length).fill(null),
    submitted: new Array(unitQuiz.questions.length).fill(false),
    currentScore: 0
  };
}

function renderUnitQuiz(ui) {
  var container = document.getElementById('uqc-' + ui);
  var unitQuiz = UNIT_QUIZ[ui];
  var state = unitQuizState[ui];
  var html = '';
  for (var i = 0; i < unitQuiz.questions.length; i++) {
    var q = unitQuiz.questions[i];
    var typeClass = 'uq-' + q.type;
    html += '<div class="uq-card">';
    html += '<span class="uq-type-badge ' + typeClass + '">' + q.typeLabel + '</span>';
    html += '<div class="uq-source">' + q.source + '</div>';
    if (q.material) {
      html += '<div class="uq-material-text">' + q.material + '</div>';
    }
    html += '<div class="uq-question">' + (i + 1) + '. ' + q.q + '</div>';
    
    if (q.type === 'judge') {
      html += '<div class="uq-judge-options">';
      html += '<div class="uq-judge-btn';
      if (state.answers[i] === true) html += ' selected';
      if (state.submitted[i]) {
        if (q.answer === true) html += ' correct';
        else if (state.answers[i] === true) html += ' wrong';
        html += ' disabled';
      }
      html += '" onclick="selectUnitJudge(' + ui + ',' + i + ',true)">正确</div>';
      html += '<div class="uq-judge-btn';
      if (state.answers[i] === false) html += ' selected';
      if (state.submitted[i]) {
        if (q.answer === false) html += ' correct';
        else if (state.answers[i] === false) html += ' wrong';
        html += ' disabled';
      }
      html += '" onclick="selectUnitJudge(' + ui + ',' + i + ',false)">错误</div>';
      html += '</div>';
    } else {
      html += '<div class="uq-options">';
      var labels = ['A', 'B', 'C', 'D'];
      for (var o = 0; o < q.options.length; o++) {
        html += '<div class="uq-option';
        if (state.answers[i] === o) html += ' selected';
        if (state.submitted[i]) {
          if (q.answer === o) html += ' correct';
          else if (state.answers[i] === o) html += ' wrong';
          html += ' disabled';
        }
        html += '" onclick="selectUnitOption(' + ui + ',' + i + ',' + o + ')">';
        html += '<span class="opt-label">' + labels[o] + '</span>';
        html += '<span class="opt-text">' + q.options[o] + '</span></div>';
      }
      html += '</div>';
    }
    
    html += '<div class="uq-explain' + (state.submitted[i] ? ' show' : '') + '">';
    html += '<strong>解析：</strong>' + q.explain + '</div>';
    
    if (!state.submitted[i]) {
      html += '<div class="btn-row">';
      html += '<button class="btn btn-primary" ' + (state.answers[i] === null ? 'disabled' : '') + ' onclick="submitUnitAnswer(' + ui + ',' + i + ')">提交答案</button>';
      html += '</div>';
    }
    
    html += '</div>';
  }
  
  // 得分统计条
  var submittedCount = state.submitted.filter(function(s) { return s; }).length;
  html += '<div class="uq-score-bar">';
  html += '<div class="uq-score-info">已完成 <strong>' + submittedCount + '</strong> / ' + unitQuiz.questions.length + ' 题，得分 <strong>' + state.currentScore + '</strong> 分</div>';
  html += '<button class="uq-reset-btn" onclick="resetUnitQuiz(' + ui + ')">重新测试</button>';
  html += '</div>';
  
  container.innerHTML = html;
}

function selectUnitOption(ui, qi, oi) {
  var state = unitQuizState[ui];
  if (state.submitted[qi]) return;
  state.answers[qi] = oi;
  renderUnitQuiz(ui);
}

function selectUnitJudge(ui, qi, val) {
  var state = unitQuizState[ui];
  if (state.submitted[qi]) return;
  state.answers[qi] = val;
  renderUnitQuiz(ui);
}

function submitUnitAnswer(ui, qi) {
  var state = unitQuizState[ui];
  var unitQuiz = UNIT_QUIZ[ui];
  var q = unitQuiz.questions[qi];
  if (state.answers[qi] === null) return;
  state.submitted[qi] = true;
  var correct = false;
  if (q.type === 'judge') {
    correct = state.answers[qi] === q.answer;
  } else {
    correct = state.answers[qi] === q.answer;
  }
  if (correct) state.currentScore += 10;
  renderUnitQuiz(ui);
}

function resetUnitQuiz(ui) {
  var unitQuiz = UNIT_QUIZ[ui];
  unitQuizState[ui] = {
    answers: new Array(unitQuiz.questions.length).fill(null),
    submitted: new Array(unitQuiz.questions.length).fill(false),
    currentScore: 0
  };
  renderUnitQuiz(ui);
}

// ============================================================
// 互动测试 - 开始/返回
// ============================================================
function startQuiz(mode) {
  var session = loadSession(mode);
  if (session && session.current < session.questions.length) {
    quizState.mode = mode;
    quizState.round = session.round;
    quizState.current = session.current;
    quizState.score = session.score;
    quizState.questions = session.questions;
    quizState.results = session.results;
    quizState.answered = session.answered;
    quizState.selectedAnswer = session.selectedAnswer;
    quizState.matchState = session.matchState || {};
    quizState.sortState = session.sortState || {};
    
    document.getElementById('quizIntro').style.display = 'none';
    var area = document.getElementById('quizArea');
    area.style.display = 'block';
    area.classList.add('active');
    renderQuestionFromState();
    return;
  }
  
  var round = getRound(mode);
  var roundKey = 'round' + round;
  
  var questions = [];
  if (mode === 'all') {
    var allModes = ['time', 'sort', 'match', 'art', 'find'];
    var pool = [];
    for (var m = 0; m < allModes.length; m++) {
      var modeQuestions = QUESTIONS[allModes[m]][roundKey];
      for (var q = 0; q < modeQuestions.length; q++) {
        pool.push({ type: allModes[m], data: modeQuestions[q] });
      }
    }
    pool = shuffle(pool);
    questions = pool.slice(0, 10);
  } else {
    var rawQuestions = QUESTIONS[mode][roundKey];
    var shuffled = shuffle(rawQuestions.slice());
    var selected = shuffled.slice(0, 10);
    for (var i = 0; i < selected.length; i++) {
      questions.push({ type: mode, data: selected[i] });
    }
  }
  
  quizState.mode = mode;
  quizState.round = round;
  quizState.questions = questions;
  quizState.current = 0;
  quizState.score = 0;
  quizState.answered = false;
  quizState.results = [];
  quizState.selectedAnswer = null;
  quizState.matchState = {};
  quizState.sortState = {};
  
  // 初始化排序题状态
  for (var i = 0; i < questions.length; i++) {
    if (questions[i].type === 'sort') {
      quizState.sortState[i] = questions[i].data.items.slice();
    }
  }
  
  document.getElementById('quizIntro').style.display = 'none';
  var area = document.getElementById('quizArea');
  area.style.display = 'block';
  area.classList.add('active');
  
  saveSession();
  renderQuestion();
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i];
    a[i] = a[j];
    a[j] = t;
  }
  return a;
}

function backToModes() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('quizIntro').style.display = 'block';
  renderModes();
}

// ============================================================
// 互动测试 - 题目渲染
// ============================================================
function renderQuestion() {
  var q = quizState.questions[quizState.current];
  var total = quizState.questions.length;
  var progress = ((quizState.current) / total) * 100;
  renderQuestionUI(q, total, progress, false);
}

function renderQuestionFromState() {
  var q = quizState.questions[quizState.current];
  var total = quizState.questions.length;
  var progress = ((quizState.current) / total) * 100;
  renderQuestionUI(q, total, progress, true);
}

function reRenderSort(q) {
  var list = document.querySelector('.sort-list');
  if (!list) return;
  var items = quizState.sortState[quizState.current];
  var html = '';
  for (var i = 0; i < items.length; i++) {
    html += '<div class="sort-item">';
    html += '<span class="sort-num">' + (i + 1) + '</span>';
    html += '<span class="sort-text">' + items[i] + '</span>';
    html += '<div class="sort-controls">';
    if (i > 0) html += '<button class="sort-btn" onclick="moveSort(' + i + ',-1)">&#9650;</button>';
    if (i < items.length - 1) html += '<button class="sort-btn" onclick="moveSort(' + i + ',1)">&#9660;</button>';
    html += '</div></div>';
  }
  list.innerHTML = html;
}

function reRenderMatch(q) {
  var grid = document.querySelector('.match-grid');
  if (!grid) return;
  var ms = quizState.matchState[quizState.current] || { leftIdx: null, pairs: [], pairCount: 0 };
  var labels = ['A', 'B', 'C', 'D'];
  var html = '';
  html += '<div class="match-col"><div class="match-col-title">名言</div>';
  for (var i = 0; i < q.data.left.length; i++) {
    var matched = ms.pairs.indexOf(i) >= 0;
    var pairNum = ms.pairs.indexOf(i);
    var cls = 'match-item';
    if (matched) cls += ' matched';
    else if (ms.leftIdx === i) cls += ' selected-left';
    html += '<div class="' + cls + '" onclick="selectMatch(\'left\',' + i + ')">';
    html += q.data.left[i];
    if (matched) html += '<span class="match-pair-num">' + labels[pairNum] + '</span>';
    html += '</div>';
  }
  html += '</div>';
  
  html += '<div class="match-col"><div class="match-col-title">蕴含道理</div>';
  for (var i = 0; i < q.data.right.length; i++) {
    var rightMatched = ms.pairs[i] !== undefined && ms.pairs[i] !== null;
    var cls = 'match-item';
    if (rightMatched) cls += ' matched';
    html += '<div class="' + cls + '" onclick="selectMatch(\'right\',' + i + ')">';
    html += '<span>' + labels[i] + '. </span>' + q.data.right[i];
    if (rightMatched) html += '<span class="match-pair-num">' + (i + 1) + '</span>';
    html += '</div>';
  }
  html += '</div>';
  
  grid.innerHTML = html;
}

function renderQuestionUI(q, total, progress, fromState) {
  var area = document.getElementById('quizArea');
  var typeLabel = '';
  var badgeClass = '';
  switch (q.type) {
    case 'time': typeLabel = '材料选择'; badgeClass = 'badge-time'; break;
    case 'sort': typeLabel = '价值排序'; badgeClass = 'badge-sort'; break;
    case 'match': typeLabel = '名言解读'; badgeClass = 'badge-match'; break;
    case 'art': typeLabel = '情境分析'; badgeClass = 'badge-art'; break;
    case 'find': typeLabel = '观点辨析'; badgeClass = 'badge-find'; break;
  }
  
  var html = '';
  html += '<button class="back-btn" onclick="backToModes()">&#8592; 返回模式选择</button>';
  
  html += '<div class="quiz-header-bar">';
  html += '<div class="quiz-mode-title">' + MODE_NAMES[quizState.mode] + ' · 第' + quizState.round + '轮</div>';
  html += '<span class="quiz-round-badge">第 ' + (quizState.current + 1) + ' / ' + total + ' 题</span>';
  html += '</div>';
  
  html += '<div class="quiz-topbar">';
  html += '<div class="quiz-progress"><div class="quiz-progress-bar" style="width:' + progress + '%"></div></div>';
  html += '<div class="quiz-stats">';
  html += '<span class="stat-item">已答 <strong>' + quizState.current + '</strong></span>';
  html += '<span class="stat-item score">得分 <strong>' + quizState.score + '</strong></span>';
  html += '</div></div>';
  
  html += '<div class="question-card">';
  html += '<span class="q-type-badge ' + badgeClass + '">' + typeLabel + '</span>';
  
  if (q.data.source) {
    html += '<div class="q-source">' + q.data.source + '</div>';
  }
  
  html += '<div class="q-text">' + q.data.q + '</div>';
  
  // 选择题/辨析题
  if (q.type === 'time' || q.type === 'art' || q.type === 'find' || (q.type === 'all' && q.data.type && (q.data.type === 'choice' || q.data.type === 'find'))) {
    var actualData = q.type === 'all' ? q.data : q.data;
    html += '<div class="q-options">';
    var labels = ['A', 'B', 'C', 'D'];
    for (var i = 0; i < actualData.options.length; i++) {
      var optCls = 'q-option';
      if (quizState.answered) {
        var correctIdx = actualData.answer;
        if (correctIdx === i) optCls += ' correct';
        else if (quizState.selectedAnswer === i) optCls += ' wrong';
        optCls += ' disabled';
      } else if (quizState.selectedAnswer === i) {
        optCls += ' selected';
      }
      html += '<div class="' + optCls + '" onclick="selectOption(' + i + ')">';
      html += '<span class="opt-label">' + labels[i] + '</span>';
      html += '<span class="opt-text">' + actualData.options[i] + '</span></div>';
    }
    html += '</div>';
  }
  // 排序题
  else if (q.type === 'sort') {
    html += '<div class="sort-list" id="sortList"></div>';
  }
  // 匹配题
  else if (q.type === 'match') {
    if (!quizState.matchState[quizState.current]) {
      quizState.matchState[quizState.current] = { leftIdx: null, pairs: new Array(q.data.right.length).fill(null), pairCount: 0 };
    }
    html += '<div class="match-grid" id="matchGrid"></div>';
  }
  // all模式中的match/sort
  else if (q.type === 'all' && q.data.type === 'match') {
    if (!quizState.matchState[quizState.current]) {
      quizState.matchState[quizState.current] = { leftIdx: null, pairs: new Array(q.data.right.length).fill(null), pairCount: 0 };
    }
    html += '<div class="match-grid" id="matchGrid"></div>';
  }
  else if (q.type === 'all' && q.data.type === 'sort') {
    html += '<div class="sort-list" id="sortList"></div>';
  }
  
  // 反馈
  html += '<div class="feedback" id="feedback">';
  html += '<div class="fb-title" id="fbTitle"></div>';
  html += '<div class="fb-explain" id="fbExplain"></div>';
  html += '</div>';
  
  // 按钮
  html += '<div class="btn-row">';
  if (!quizState.answered) {
    var canSubmit = false;
    if (q.type === 'time' || q.type === 'art' || q.type === 'find') {
      canSubmit = quizState.selectedAnswer !== null;
    } else if (q.type === 'sort') {
      canSubmit = true;
    } else if (q.type === 'match') {
      var ms = quizState.matchState[quizState.current];
      canSubmit = ms && ms.pairCount === q.data.right.length;
    } else if (q.type === 'all') {
      if (q.data.type === 'choice' || q.data.type === 'find') {
        canSubmit = quizState.selectedAnswer !== null;
      } else if (q.data.type === 'sort') {
        canSubmit = true;
      } else if (q.data.type === 'match') {
        var ms2 = quizState.matchState[quizState.current];
        canSubmit = ms2 && ms2.pairCount === q.data.right.length;
      }
    }
    html += '<button class="btn btn-primary" ' + (canSubmit ? '' : 'disabled') + ' onclick="submitAnswer()">提交答案</button>';
  } else {
    if (quizState.current < total - 1) {
      html += '<button class="btn btn-primary" onclick="nextQuestion()">下一题 &#8594;</button>';
    } else {
      html += '<button class="btn btn-primary" onclick="showResult()">查看结果</button>';
    }
  }
  html += '</div>';
  
  html += '</div>';
  
  area.innerHTML = html;
  
  // 渲染排序/匹配
  if (q.type === 'sort' || (q.type === 'all' && q.data.type === 'sort')) {
    reRenderSort(q);
  }
  if (q.type === 'match' || (q.type === 'all' && q.data.type === 'match')) {
    reRenderMatch(q);
  }
  
  // 如果已回答，显示反馈
  if (quizState.answered) {
    revealAnswer(q);
  }
}

// ============================================================
// 互动测试 - 交互函数
// ============================================================
function selectOption(idx) {
  if (quizState.answered) return;
  quizState.selectedAnswer = idx;
  saveSession();
  renderQuestionFromState();
}

function moveSort(pos, dir) {
  if (quizState.answered) return;
  var items = quizState.sortState[quizState.current];
  var newPos = pos + dir;
  if (newPos < 0 || newPos >= items.length) return;
  var t = items[pos];
  items[pos] = items[newPos];
  items[newPos] = t;
  saveSession();
  var q = quizState.questions[quizState.current];
  reRenderSort(q);
  // 更新提交按钮状态
  var btn = document.querySelector('.btn-primary');
  if (btn) btn.disabled = false;
}

function selectMatch(side, idx) {
  if (quizState.answered) return;
  var ms = quizState.matchState[quizState.current];
  if (!ms) return;
  
  if (side === 'left') {
    // 检查是否已经匹配
    if (ms.pairs.indexOf(idx) >= 0) return;
    ms.leftIdx = idx;
  } else {
    // 右边
    if (ms.leftIdx === null) return;
    if (ms.pairs[idx] !== null) return;
    ms.pairs[idx] = ms.leftIdx;
    ms.pairCount++;
    ms.leftIdx = null;
  }
  
  saveSession();
  var q = quizState.questions[quizState.current];
  reRenderMatch(q);
  
  // 检查是否全部匹配完成，更新提交按钮
  if (ms.pairCount === q.data.right.length) {
    var btn = document.querySelector('.btn-primary');
    if (btn) btn.disabled = false;
  }
}

function submitAnswer() {
  if (quizState.answered) return;
  var q = quizState.questions[quizState.current];
  var correct = false;
  
  // 选择题
  if (q.type === 'time' || q.type === 'art' || q.type === 'find') {
    if (quizState.selectedAnswer === null) return;
    correct = quizState.selectedAnswer === q.data.answer;
  }
  // 排序题
  else if (q.type === 'sort') {
    var items = quizState.sortState[quizState.current];
    var correctOrder = q.data.order;
    var allCorrect = true;
    for (var i = 0; i < items.length; i++) {
      var correctIdx = correctOrder[i];
      if (items[i] !== q.data.items[correctIdx]) {
        allCorrect = false;
        break;
      }
    }
    correct = allCorrect;
  }
  // 匹配题
  else if (q.type === 'match') {
    var ms = quizState.matchState[quizState.current];
    if (!ms || ms.pairCount < q.data.right.length) return;
    var allMatch = true;
    for (var i = 0; i < q.data.pairs.length; i++) {
      if (ms.pairs[i] !== q.data.pairs[i]) {
        allMatch = false;
        break;
      }
    }
    correct = allMatch;
  }
  // all模式
  else if (q.type === 'all') {
    if (q.data.type === 'choice' || q.data.type === 'find') {
      if (quizState.selectedAnswer === null) return;
      correct = quizState.selectedAnswer === q.data.answer;
    } else if (q.data.type === 'sort') {
      var items = quizState.sortState[quizState.current];
      var correctOrder = q.data.order;
      var allCorrect = true;
      for (var i = 0; i < items.length; i++) {
        var correctIdx = correctOrder[i];
        if (items[i] !== q.data.items[correctIdx]) {
          allCorrect = false;
          break;
        }
      }
      correct = allCorrect;
    } else if (q.data.type === 'match') {
      var ms = quizState.matchState[quizState.current];
      if (!ms || ms.pairCount < q.data.right.length) return;
      var allMatch = true;
      for (var i = 0; i < q.data.pairs.length; i++) {
        if (ms.pairs[i] !== q.data.pairs[i]) {
          allMatch = false;
          break;
        }
      }
      correct = allMatch;
    }
  }
  
  if (correct) {
    quizState.score += 10;
  }
  
  quizState.answered = true;
  quizState.results.push({
    correct: correct,
    answer: quizState.selectedAnswer
  });
  
  saveSession();
  renderQuestionFromState();
}

function revealAnswer(q) {
  var feedback = document.getElementById('feedback');
  var fbTitle = document.getElementById('fbTitle');
  var fbExplain = document.getElementById('fbExplain');
  
  var lastResult = quizState.results[quizState.results.length - 1];
  if (lastResult.correct) {
    feedback.className = 'feedback correct show';
    fbTitle.textContent = '回答正确！+10分';
  } else {
    feedback.className = 'feedback wrong show';
    fbTitle.textContent = '回答错误';
  }
  
  fbExplain.innerHTML = '<strong>解析：</strong>' + q.data.explain;
  
  // 排序题显示正确位置
  if (q.type === 'sort') {
    var sortItems = document.querySelectorAll('.sort-item');
    var correctOrder = q.data.order;
    for (var i = 0; i < sortItems.length; i++) {
      var currentItem = quizState.sortState[quizState.current][i];
      var correctItem = q.data.items[correctOrder[i]];
      if (currentItem === correctItem) {
        sortItems[i].classList.add('placed');
      } else {
        sortItems[i].classList.add('placed', 'wrong-pos');
      }
    }
  }
}

function nextQuestion() {
  quizState.current++;
  quizState.answered = false;
  quizState.selectedAnswer = null;
  saveSession();
  renderQuestion();
}

function showResult() {
  var total = quizState.questions.length;
  var score = quizState.score;
  var percent = Math.round(score / total * 10);
  var correct = quizState.results.filter(function(r) { return r.correct; }).length;
  
  var grade = '';
  var msg = '';
  if (percent >= 9) { grade = '优秀'; msg = '太棒了！你对道法知识掌握得非常扎实！'; }
  else if (percent >= 7) { grade = '良好'; msg = '不错哦！继续努力，争取更好的成绩！'; }
  else if (percent >= 6) { grade = '及格'; msg = '基本掌握了知识点，还需要多加练习哦！'; }
  else { grade = '需努力'; msg = '要加油哦！多复习知识点，相信你一定可以的！'; }
  
  var area = document.getElementById('quizArea');
  var html = '';
  html += '<button class="back-btn" onclick="backToModes()">&#8592; 返回模式选择</button>';
  
  html += '<div class="result-card">';
  html += '<h2 style="color:var(--gold);margin-bottom:10px;">' + MODE_NAMES[quizState.mode] + ' - 第' + quizState.round + '轮</h2>';
  html += '<div class="result-grade">' + grade + '</div>';
  html += '<div class="result-score">' + percent + '分</div>';
  html += '<div class="result-msg">' + msg + '</div>';
  
  html += '<div class="result-badges">';
  html += '<span class="badge">共 ' + total + ' 题</span>';
  html += '<span class="badge">正确 ' + correct + ' 题</span>';
  html += '<span class="badge">正确率 ' + Math.round(correct / total * 100) + '%</span>';
  html += '</div>';
  
  html += '<div class="result-detail">';
  html += '<div class="result-row"><span>模式</span><span>' + MODE_NAMES[quizState.mode] + '</span></div>';
  html += '<div class="result-row"><span>轮次</span><span>第 ' + quizState.round + ' 轮</span></div>';
  html += '<div class="result-row"><span>总得分</span><span>' + score + ' 分</span></div>';
  html += '<div class="result-row"><span>百分制</span><span>' + Math.round(score / total * 100) + ' 分</span></div>';
  html += '</div>';
  
  // 晋级提示
  var canAdvance = percent >= 7 && quizState.round < TOTAL_ROUNDS;
  if (canAdvance) {
    html += '<div class="round-upgrade">恭喜你达到70分以上，已解锁下一轮！</div>';
    advanceRound(quizState.mode);
  } else if (percent < 7 && quizState.round < TOTAL_ROUNDS) {
    html += '<div style="margin-top:16px;padding:12px 16px;border-radius:10px;background:rgba(229,57,53,0.1);border:1px solid var(--crimson);color:var(--crimson);font-size:0.9em;">得分不足70分，继续努力，再试一次吧！</div>';
  } else if (quizState.round >= TOTAL_ROUNDS && percent >= 7) {
    html += '<div class="round-upgrade">恭喜你完成了全部3轮挑战，你已经掌握了本模式的知识点！</div>';
  }
  
  // 保存统计
  saveStats(percent, correct, total, quizState.mode, quizState.round);
  
  // 清除session
  clearSession(quizState.mode);
  
  html += '<div class="btn-row" style="justify-content:center;">';
  html += '<button class="btn btn-secondary" onclick="backToModes()">返回模式选择</button>';
  html += '<button class="btn btn-primary" onclick="retryQuiz()">再试一次</button>';
  html += '</div>';
  
  html += '</div>';
  
  area.innerHTML = html;
}

function retryQuiz() { 
  var mode = quizState.mode;
  clearSession(mode);
  startQuiz(mode);
}

// ============================================================
// 学习统计
// ============================================================
function saveStats(percent, correct, total, mode, round) {
  var d = loadAllData();
  var now = new Date();
  var dateStr = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate() + ' ' + now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
  d.stats.unshift({
    mode: MODE_NAMES[mode],
    round: round,
    percent: percent * 10,
    correct: correct,
    total: total,
    date: dateStr
  });
  if (d.stats.length > 50) d.stats = d.stats.slice(0, 50);
  saveAllData(d);
}

function renderStats() {
  var container = document.getElementById('statsContent');
  var d = loadAllData();
  
  if (d.stats.length === 0) {
    container.innerHTML = '<p style="color:var(--muted);">完成测试后，你的成绩和知识点掌握情况将在这里展示。</p>';
    return;
  }
  
  var totalTests = d.stats.length;
  var totalCorrect = 0;
  var totalQuestions = 0;
  var avgScore = 0;
  var bestScore = 0;
  
  for (var i = 0; i < d.stats.length; i++) {
    totalCorrect += d.stats[i].correct;
    totalQuestions += d.stats[i].total;
    avgScore += d.stats[i].percent;
    if (d.stats[i].percent > bestScore) bestScore = d.stats[i].percent;
  }
  avgScore = Math.round(avgScore / totalTests * 10) / 10;
  
  var html = '';
  html += '<div class="result-badges" style="margin-bottom:24px;">';
  html += '<span class="badge">完成测试 ' + totalTests + ' 次</span>';
  html += '<span class="badge">总题数 ' + totalQuestions + ' 题</span>';
  html += '<span class="badge">平均分 ' + avgScore + ' 分</span>';
  html += '<span class="badge">最高分 ' + bestScore + ' 分</span>';
  html += '</div>';
  
  html += '<h3 style="color:var(--accent);margin-bottom:12px;font-size:1em;">最近记录</h3>';
  html += '<div class="result-detail">';
  
  var showCount = Math.min(d.stats.length, 20);
  for (var i = 0; i < showCount; i++) {
    var r = d.stats[i];
    var color = r.percent >= 70 ? 'var(--jade)' : (r.percent >= 60 ? 'var(--gold)' : 'var(--crimson)');
    html += '<div class="result-row"><span>' + r.mode + ' 第' + r.round + '轮 - ' + r.date + '</span><span style="color:' + color + ';">' + r.percent + '分</span></div>';
  }
  html += '</div>';
  
  container.innerHTML = html;
}

// ============================================================
// 导航
// ============================================================
function switchTab(tabName) {
  var btns = document.querySelectorAll('.nav-btn');
  var secs = document.querySelectorAll('.section');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.remove('active');
    if (btns[i].getAttribute('data-tab') === tabName) btns[i].classList.add('active');
  }
  for (var j = 0; j < secs.length; j++) {
    secs[j].classList.remove('active');
    if (secs[j].id === tabName) secs[j].classList.add('active');
  }
  if (tabName === 'quiz') renderModes();
  if (tabName === 'stats') renderStats();
}

// ============================================================
// 初始化
// ============================================================
renderReview();
renderModes();
renderStats();
</script>
